<div class="main">
    <div class="container-fluid">
        <!-- <div class="table-top-section d-flex justify-content-between align-items-center mb-4"> -->
            <!-- <a class="back-btn" href="#">
                <i class="icon-left-arrow"></i>
                Go Back
            </a> -->
            <div class="section-header mb-4">
                <app-header-right-template class="section-header"></app-header-right-template>
            </div>
        <!-- </div> -->
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-client-leftbar-template [activeComp]="'kyc-info'" [activeSubComp]="''"
                            [clientId]="clientId" [leadId]="leadId" [mode]="mode"
                            [progressPercentage]="33"></app-client-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <section class="trial active" id="account-opening" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBackClicked()"></i> Account
                                        Opening</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="form-sections">
                                        <h4 class="form-section-title text-uppercase">Please select a profile for
                                            account creation</h4>
                                        <div class="form-inline" id="accountprofile">
                                            <ng-container *ngFor="let member of members">
                                                <div class="form-group custom-checkbox checkbox-2 d-inline-block ms-2"
                                                    *ngIf="!member.IsAccountCreated">
                                                    <input type="checkbox" id="profile.{{member.ClientFamilyId}}"
                                                        name="profile.{{member.ClientFamilyId}}"
                                                        [(ngModel)]="member.IsSelected" [disabled]="!isEdit">
                                                    <label
                                                        for="profile.{{member.ClientFamilyId}}">{{member.Name}}</label>
                                                </div>
                                                <div class="form-group custom-checkbox checked checkbox-2 d-inline-block ms-2"
                                                    *ngIf="member.IsAccountCreated">
                                                    <input type="checkbox" id="profile.{{member.ClientFamilyId}}"
                                                        name="profile.{{member.ClientFamilyId}}"
                                                        [(ngModel)]="member.IsSelected" [disabled]="true">
                                                    <label
                                                        for="profile.{{member.ClientFamilyId}}">{{member.Name}}</label>
                                                </div>
                                            </ng-container>
                                            <ng-container *ngFor="let company of companies">
                                                <div class="form-group custom-checkbox checkbox-2 d-inline-block ms-2"
                                                    *ngIf="!company.IsAccountCreated">
                                                    <input type="checkbox" id="profile.{{company.ClientCompanyId}}.c"
                                                        name="profile.{{company.ClientCompanyId}}.c"
                                                        [(ngModel)]="company.IsSelected" [disabled]="!isEdit">
                                                    <label
                                                        for="profile.{{company.ClientCompanyId}}.c">{{company.Name}}</label>
                                                </div>
                                                <div class="form-group custom-checkbox checked checkbox-2 d-inline-block ms-2"
                                                    *ngIf="company.IsAccountCreated">
                                                    <input type="checkbox" id="profile.{{company.ClientCompanyId}}.c"
                                                        name="profile.{{company.ClientCompanyId}}.c"
                                                        [(ngModel)]="company.IsSelected" [disabled]="true">
                                                    <label
                                                        for="profile.{{company.ClientCompanyId}}.c">{{company.Name}}</label>
                                                </div>
                                            </ng-container>
                                        </div>
                                    </div>
                                    <div class="indicators mt-4">
                                        <h4 class="form-section-title text-uppercase">Indicators</h4>
                                        <ul>
                                            <li>
                                                <div class="form-group custom-checkbox  mb-0">
                                                    <input type="checkbox" disabled checked>
                                                    <label>Profile selected for account creation</label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="form-group custom-checkbox  mb-0">
                                                    <input type="checkbox" disabled>
                                                    <label>Profile not selected for account creation</label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="form-group custom-checkbox checked mb-0">
                                                    <!-- <input type="checkbox" id="neha"> -->
                                                    <label for="neha">Account already created</label>
                                                </div>
                                            </li>

                                        </ul>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
