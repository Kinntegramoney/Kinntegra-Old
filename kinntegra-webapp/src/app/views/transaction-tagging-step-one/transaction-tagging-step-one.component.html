<div class="table-top-section">
    <div class="section-header mb-4">
        <app-header-right-template class="section-header"></app-header-right-template>
    </div>
</div>
<div class="card w-100">
    <div class="card-body">
        <h3 class="card-title border-bottom">
            <svg width="50" height="50" viewBox="0 5 50 50">
                <use xlink:href="#new-transactions" />
            </svg>
            Transaction Tagging: Step 1
        </h3>
        <div class="row">
            <div class="col-lg-6 col-xl-6">
                <div class="form-group">
                    <label>Client</label>
                    <div class="form-control ng-select-form-control">
                        <ng-select [(ngModel)]="PANCardNumber" name="PANCardNumber" class="clb-select"
                            [dropdownPosition]="'bottom'">
                            <ng-option *ngFor="let item of profiles" [value]="item.PANCardNumber">
                                {{item.Name}} - {{item.PANCardNumber}}
                            </ng-option>
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer">
        <div class="text-right">
            <button type="button" class="btn btn-primary btn-lg proceed" (click)="onProceed()">
                <div *ngIf="isBusy">
                    <span class="spinner-border text-light" style="margin-right: 10px; vertical-align: middle;"
                        role="status"></span>
                    <span>Next</span>
                </div>
                <span *ngIf="!isBusy">Next</span>
            </button>
        </div>
    </div>
</div>
