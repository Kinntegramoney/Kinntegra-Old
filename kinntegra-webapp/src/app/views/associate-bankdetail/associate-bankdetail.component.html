<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-associate-leftbar-template [activeComp]="'entity-detail'" [activeSubComp]="'bank'"
                            [associateId]="associateid" [progressPercentage]="35" [mode]="mode"
                            [ts]="ts"></app-associate-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <section class="trial step5 active" id="bank-detail" data-step="5" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                                            (click)="onBack()"></i> Bank
                                        Details
                                    </h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row">
                                                <!-- <div class="col-sm-12 mdf_ria">
                                                    <h4 class="card-title">MFD Bank Details</h4>
                                                </div> -->
                                                <div class="col-sm-8 ifsc_no">
                                                    <div class="form-group">
                                                        <label>IFSC Code <span class="required-sign">*</span></label>
                                                        <div class="input-group ">
                                                            <input type="text" class="form-control text-uppercase"
                                                                placeholder="Enter IFSC Code" aria-label="ifsc_no"
                                                                id="ifsc_no" name="ifsc_no" [(ngModel)]="objBank.IFSC"
                                                                maxlength="11" aria-describedby="ifsc_no"
                                                                [disabled]="!isEdit">
                                                            <div class="input-group-append">
                                                                <span class="input-group-text ifsc_search"
                                                                    id="ifsc_search" (click)="onIfscSearch()">
                                                                    <svg width="24" height="24" viewBox="0 0 24 24">
                                                                        <use xlink:href="#search" />
                                                                    </svg>
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 cheque_upload">
                                                    <div class="form-group">
                                                        <label for="cheque_upload" class="w-100">Bank PROOF
                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="cheque_upload" class="btn input-btn w-100"
                                                            [ngClass]="{'input-btn-primary': (bankProofFileName != ''), 'input-btn-danger': (bankProofFileName == '')}"
                                                            [ngbTooltip]="bankProofFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="cheque_upload" type="file" name="cheque_upload"
                                                                (change)="onBankProofFileChanged($event)"
                                                                [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <span class="default-text"
                                                                    *ngIf="bankProofFileName == ''">Upload</span>
                                                                <span class="value"
                                                                    *ngIf="bankProofFileName != ''">{{bankProofFileName|fileDisplayName}}</span>
                                                            </div>
                                                        </label>
                                                        <label class="w-100 format" *ngIf="bankProofFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>
                                                        <label class="w-100 preview" *ngIf="bankProofFileName != ''">
                                                            <span class="text-lowercase font-italic"><a
                                                                    (click)="onBankPreview()">Preview</a></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 bank_name">
                                                    <div class="form-group">
                                                        <label for="bank_name">Bank Name <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control  text-capitalize"
                                                            id="bank_name" [(ngModel)]="objBank.BankName"
                                                            name="bank_name" aria-describedby="bank_name"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 branch_name">
                                                    <div class="form-group">
                                                        <label for="branch_name">Branch <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="branch_name" [(ngModel)]="objBank.Branch"
                                                            name="branch_name" aria-describedby="branch_name"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 micr">
                                                    <div class="form-group">
                                                        <label for="micr">MICR </label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="micr" name="micr" [(ngModel)]="objBank.MICR"
                                                            maxlength="9" aria-describedby="micr"
                                                            placeholder="Enter MICR" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 account_type">
                                                    <div class="form-group">
                                                        <label for="account_type">Account Type <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objBank.BankAccountTypeId"
                                                                name="bankAccountType" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option
                                                                    *ngFor="let bankaccounttype of bankaccounttypes"
                                                                    [value]="bankaccounttype.Id">{{bankaccounttype.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 account_no">
                                                    <div class="form-group">
                                                        <label for="account_no">Account Number <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="account_no"
                                                            [(ngModel)]="objBank.AccountNumber"
                                                            aria-describedby="account_no" name="account_no"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row" id="mfd_ria_bank" *ngIf="showRIA">
                                                <div class="col-sm-12">
                                                    <h4 class="card-title">RIA Bank Details</h4>
                                                </div>
                                                <div class="col-sm-8 mfd_ria_ifsc_no">
                                                    <div class="form-group">
                                                        <label>IFSC Code <span class="required-sign">*</span></label>
                                                        <div class="input-group ">
                                                            <input type="text" class="form-control text-uppercase"
                                                                placeholder="Enter IFSC Code"
                                                                aria-label="mfd_ria_ifsc_no" id="mfd_ria_ifsc_no"
                                                                name="mfd_ria_ifsc_no_RIA"
                                                                [(ngModel)]="objBankRIA.RIAIFSC" maxlength="11"
                                                                aria-describedby="mfd_ria_ifsc_no" [disabled]="!isEdit">
                                                            <div class="input-group-append">
                                                                <span class="input-group-text mfd_ria_ifsc_search"
                                                                    id="mfd_ria_ifsc_search"
                                                                    (click)="onIfscRIASearch()">
                                                                    <svg width="24" height="24" viewBox="0 0 24 24">
                                                                        <use xlink:href="#search" />
                                                                    </svg>
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 mfd_ria_cheque_upload">
                                                    <div class="form-group">
                                                        <label for="mfd_ria_cheque_upload" class="w-100">PROOF
                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="mfd_ria_cheque_upload" class="btn input-btn w-100"
                                                            [ngClass]="{'input-btn-primary': (bankProofRIAFileName != ''), 'input-btn-danger': (bankProofRIAFileName == '')}"
                                                            [ngbTooltip]="bankProofRIAFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="mfd_ria_cheque_upload" type="file"
                                                                name="mfd_ria_cheque_upload"
                                                                (change)="onBankProofRIAFileChanged($event)"
                                                                [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <span class="default-text"
                                                                    *ngIf="bankProofRIAFileName == ''">Upload</span>
                                                                <span class="value"
                                                                    *ngIf="bankProofRIAFileName != ''">{{bankProofRIAFileName|fileDisplayName}}</span>
                                                            </div>
                                                        </label>
                                                        <label class="w-100 format" *ngIf="bankProofRIAFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>
                                                        <label class="w-100 preview" *ngIf="bankProofRIAFileName != ''">
                                                            <span class="text-lowercase font-italic"><a
                                                                    (click)="onBankRIAPreview()">Preview</a></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 mfd_ria_bank_name">
                                                    <div class="form-group">
                                                        <label for="mfd_ria_bank_name">Bank Name <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="mfd_ria_bank_name" [(ngModel)]="objBankRIA.RIABankName"
                                                            name="mfd_ria_bank_name"
                                                            aria-describedby="mfd_ria_bank_name" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 mfd_ria_branch_name">
                                                    <div class="form-group">
                                                        <label for="mfd_ria_branch_name">Branch <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="mfd_ria_branch_name" [(ngModel)]="objBankRIA.RIABranch"
                                                            name="mfd_ria_branch_name"
                                                            aria-describedby="mfd_ria_branch_name" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 mfd_ria_micr">
                                                    <div class="form-group">
                                                        <label for="mfd_ria_micr">MICR </label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="mfd_ria_micr" name="mfd_ria_micr"
                                                            [(ngModel)]="objBankRIA.RIAMICR" maxlength="9"
                                                            aria-describedby="mfd_ria_micr" placeholder="Enter MICR"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 mfd_ria_account_type">
                                                    <div class="form-group">
                                                        <label for="mfd_ria_account_type">Account Type <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objBankRIA.RIABankAccountTypeId"
                                                                name="riabankAccountType" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option
                                                                    *ngFor="let bankaccounttype of bankaccounttypes"
                                                                    [value]="bankaccounttype.Id">{{bankaccounttype.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 mfd_ria_account_no">
                                                    <div class="form-group">
                                                        <label for="mfd_ria_account_no">Account Number <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="mfd_ria_account_no"
                                                            [(ngModel)]="objBankRIA.RIAAccountNumber"
                                                            aria-describedby="mfd_ria_account_no"
                                                            name="mfd_ria_account_no" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
