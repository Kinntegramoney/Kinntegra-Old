<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-associate-leftbar-template [activeComp]="'nominee-detail'" [activeSubComp]="''"
                            [associateId]="associateid" [progressPercentage]="63" [mode]="mode"
                            [ts]="ts"></app-associate-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <section class="trial step9 active" id="nominee-detail" data-step="9" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBack()"></i> Nominee
                                    </h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row">
                                                <div class="col-sm-6 nominee_name">
                                                    <div class="form-group">
                                                        <label for="nominee_name">Nominee Name <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="nominee_name"
                                                            class="form-control text-capitalize"
                                                            [(ngModel)]="objNominee.Name" name="nominee_name"
                                                            aria-describedby="nominee_name" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_birth_date">
                                                    <div class="form-group">
                                                        <label for="nominee_birth_date">Date of Birth (In Case Of Minor Only) <span
                                                                class="minor"></span></label>
                                                        <div class="input-group">
                                                            <input class="form-control" readonly
                                                                placeholder="dd-mm-yyyy" name="dp"
                                                                [(ngModel)]="objNominee.DateOfBirth" ngbDatepicker
                                                                #d="ngbDatepicker" [minDate]="minDate"
                                                                [maxDate]="maxDate" [disabled]="!isEdit" />
                                                            <button class="btn btn-transparent" (click)="d.toggle()"
                                                                *ngIf="isEdit" type="button"><svg width="24" height="24"
                                                                    viewBox="0 0 24 24">
                                                                    <use xlink:href="#month"></use>
                                                                </svg></button>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-12">
                                                    <div class="form-group custom-checkbox">
                                                        <!-- <input type="checkbox" id="nominee_primary_address"
                                                            name="nominee_primary_address"
                                                            value="data->associate_nominee->nominee_primary_address }}"
                                                            @if
                                                            (isset($data->associate_nominee->nominee_primary_address) &&
                                                        $data->associate_nominee->nominee_primary_address == 1) {{
                                                        'checked' }} @endif> -->
                                                        <input #chkprimary type="checkbox" id="nominee_primary_address"
                                                            name="nominee_primary_address"
                                                            (change)="onPrimaryAddressChange(chkprimary.checked)"
                                                            [(ngModel)]="objNominee.IsAddressAsPrimaryHolder"
                                                            [disabled]="!isEdit">
                                                        <label for="nominee_primary_address">Address same as per Primary
                                                            Holder</label>
                                                    </div>
                                                    <!--
                                                                    <div class="form-check">
                                                                        <input type="checkbox" class="form-check-input" id="nomineeaddress" name="nomineeaddress">
                                                                        <label class="form-check-label" for="nomineeaddress">Address same as per Primary
                                                                            Holder</label>
                                                                        </div>
                                                                    <h4 class="text-uppercase mb-4 d-flex align-items-center"> <input
                                                                        type="checkbox" id="sameAddress" />
                                                                    <label for="sameAddress" class="ml-2  mb-0">Address same as per Primary
                                                                        Holder </label></h4> -->

                                                </div>
                                                <div class="col-sm-6 nominee_address1">
                                                    <div class="form-group">
                                                        <label for="nominee_address1">Address 1 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="nominee_address1" [(ngModel)]="objNominee.Address1"
                                                            aria-describedby="nominee_address1" name="nominee_address1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_address2">
                                                    <div class="form-group">
                                                        <label for="nominee_address2">Address 2</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="nominee_address2" [(ngModel)]="objNominee.Address2"
                                                            aria-describedby="nominee_address2" name="nominee_address2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_address3">
                                                    <div class="form-group">
                                                        <label for="nominee_address3">Address 3</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="nominee_address3" [(ngModel)]="objNominee.Address3"
                                                            aria-describedby="nominee_address3" name="nominee_address3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_city">
                                                    <div class="form-group">
                                                        <label for="nominee_city">City <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="nominee_city" [(ngModel)]="objNominee.City"
                                                            aria-describedby="nominee_city" name="nominee_city"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_country">
                                                    <div class="form-group">
                                                        <label for="nominee_country">Country <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objNominee.CountryId" name="country"
                                                                (change)="getState()" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let country of countries"
                                                                    [value]="country.Id">{{country.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_state">
                                                    <div class="form-group">
                                                        <label for="nominee_state">State <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objNominee.StateId" name="state"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let state of states"
                                                                    [value]="state.Id">{{state.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_pincode">
                                                    <div class="form-group">
                                                        <label for="nominee_pincode">Pincode <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="nominee_pincode" class="form-control"
                                                            [(ngModel)]="objNominee.PinCode"
                                                            aria-describedby="nominee_pincode" name="nominee_pincode"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_mobile">
                                                    <div class="form-group">
                                                        <label for="nominee_mobile">Mobile Number</label>
                                                        <input type="text" class="form-control" id="nominee_mobile"
                                                            [(ngModel)]="objNominee.MobileNumber"
                                                            maxlength="10" aria-describedby="nominee_mobile" name="nominee_mobile"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_telephone">
                                                    <div class="form-group">
                                                        <label for="nominee_telephone">TELEPHONE NO</label>
                                                        <input type="text" class="form-control" id="nominee_telephone"
                                                            [(ngModel)]="objNominee.TelephoneNumber"
                                                            aria-describedby="nominee_telephone"
                                                            name="nominee_telephone" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 nominee_email">
                                                    <div class="form-group">
                                                        <label for="nominee_email">EMAIL ADDRESS</label>
                                                        <input type="text" class="form-control" id="nominee_email"
                                                            [(ngModel)]="objNominee.Email"
                                                            aria-describedby="nominee_email" name="nominee_email"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
