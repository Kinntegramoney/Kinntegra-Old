<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header" *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>


        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">

                        <app-employee-leftbar-template [activeComp]="'employee-detail'" [activeSubComp]="''"
                            [employeeId]="employeeDetailsId" [mode]="mode" [ts]="ts"
                            [progressPercentage]="24"></app-employee-leftbar-template>

                    </div>
                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0" enctype="multipart/form-data"
                        id="form-information">
                        <section class="trial active" id="employee-detail" data-step="2" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBack()"></i> Employee
                                        Details</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>

                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row">

                                                <div class="col-sm-12">
                                                    <h4 class="card-title">Contact Details</h4>
                                                </div>
                                                <div class="col-sm-6 mobile">
                                                    <div class="form-group">
                                                        <label for="mobile">Mobile Number <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="mobile" value=""
                                                            [disabled]="!isEdit" aria-describedby="mobile" name="mobile"
                                                            maxlength="10" appInputRestriction="integer"
                                                            [(ngModel)]="objEmployee.MobileNumber">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 telephone">
                                                    <div class="form-group">
                                                        <label for="telephone">TELEPHONE NO</label>
                                                        <input type="text" class="form-control" id="telephone" value=""
                                                            [disabled]="!isEdit" aria-describedby="telephone"
                                                            name="telephone" maxlength="10"
                                                            appInputRestriction="integer"
                                                            [(ngModel)]="objEmployee.TelephoneNumber">
                                                    </div>
                                                    <!--trim($com->comment)-->
                                                </div>
                                                <div class="col-sm-6 email">
                                                    <div class="form-group">
                                                        <label for="email">EMAIL ADDRESS <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="email" value=""
                                                            [disabled]="!isEdit" aria-describedby="email" name="email"
                                                            maxlength="250" [(ngModel)]="objEmployee.Email">
                                                    </div>
                                                </div>

                                                <div class="col-sm-6 blood_group">
                                                    <div class="form-group">
                                                        <label for="blood_group">Blood Group <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objEmployee.BloodGroupId"
                                                                name="bloodgroup" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let bloodgroup of bloodgroups"
                                                                    [value]="bloodgroup.Id">{{bloodgroup.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>

                                                    </div>
                                                </div>

                                                <div class="col-sm-12">
                                                    <div class="form-group health_issue">
                                                        <label for="health_issue">Health Issue (If Any)</label>

                                                        <textarea class="form-control" id="health_issue"
                                                            name="health_issue" aria-describedby="health_issue" rows="3"
                                                            [(ngModel)]="objEmployee.HealthIssues" maxlength="1000"
                                                            [disabled]="!isEdit"></textarea>
                                                    </div>
                                                </div>
                                            </div>


                                            <div class="row" id="emergency_contact_1">
                                                <div class="col-sm-12">
                                                    <h4 class="form-group">
                                                        Emergency Contact 1
                                                    </h4>
                                                </div>
                                                <div class="col-sm-12 contact_name1">
                                                    <div class="form-group">
                                                        <label for="contact_name1">Name <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="contact_name1"
                                                            name="contact_name1" value="" [disabled]="!isEdit"
                                                            aria-describedby="contact_name1"
                                                            [(ngModel)]="objEmployee.EmergencyContactName1"
                                                            maxlength="250" />
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 contact_mobile1">
                                                    <div class="form-group">
                                                        <label for="contact_mobile1">Mobile Number <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="contact_mobile1"
                                                            value="" aria-describedby="contact_mobile1"
                                                            [disabled]="!isEdit" name="contact_mobile1"
                                                            [(ngModel)]="objEmployee.EmergencyMobileNumber1"
                                                            maxlength="10" appInputRestriction="integer">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 contact_email1">
                                                    <div class="form-group">
                                                        <label for="contact_email1">EMAIL ADDRESS <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="contact_email1"
                                                            value="" aria-describedby="contact_email1"
                                                            [disabled]="!isEdit" name="contact_email1"
                                                            [(ngModel)]="objEmployee.EmergencyEmail1" maxlength="250">
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="row" id="emergency_contact_2">
                                                <div class="col-sm-12">
                                                    <h4 class="form-group">
                                                        Emergency Contact 2
                                                    </h4>
                                                </div>
                                                <div class="col-sm-12 contact_name2">
                                                    <div class="form-group">
                                                        <label for="contact_name2">Name <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="contact_name2"
                                                            name="contact_name2" value="" [disabled]="!isEdit"
                                                            aria-describedby="contact_name2"
                                                            [(ngModel)]="objEmployee.EmergencyContactName2"
                                                            maxlength="250">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 contact_mobile2">
                                                    <div class="form-group">
                                                        <label for="contact_mobile2">Mobile Number <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="contact_mobile2"
                                                            value="" aria-describedby="contact_mobile2"
                                                            [disabled]="!isEdit" name="contact_mobile2"
                                                            [(ngModel)]="objEmployee.EmergencyMobileNumber2"
                                                            maxlength="10" appInputRestriction="integer">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 contact_email2">
                                                    <div class="form-group">
                                                        <label for="contact_email2">EMAIL ADDRESS <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="contact_email2"
                                                            value="" aria-describedby="contact_email2"
                                                            [disabled]="!isEdit" name="contact_email2"
                                                            [(ngModel)]="objEmployee.EmergencyEmail2" maxlength="250">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>

                                </div>


                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
