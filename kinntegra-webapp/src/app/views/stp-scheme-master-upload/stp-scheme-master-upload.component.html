<div class="table-top-section">
    <div class="section-header mb-4">
        <app-header-right-template class="section-header"></app-header-right-template>
    </div>
</div>
<div class="card w-100">
    <div class="card-body">
        <div class="row">
            <!-- <div class="col-xl-3 col-lg-4 col-md-4">
                <app-admin-master-leftbar-template></app-admin-master-leftbar-template>
            </div> -->
            <div class="container-fluid col-lg-8 col-xl-12">
                <!-- <div class="card-body">
                </div> -->
                <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBack()"></i>STP Scheme Master
                </h3>
                <div class="row">
                    <div class="col-lg-12 col-md-12 ">
                        <div class="card-body">
                            <!-- <ul class="nav nav-tabs mb-4" id="master_uploads_tabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <a class="nav-link active" data-toggle="tab" href="#stp-scheme-master" role="tab"
                                        aria-selected="true">STP Scheme Master</a>
                                </li>
                            </ul> -->
                            <div class="tab-content" id="master_uploads">
                                <div class="tab-pane fade active show" id="stp-scheme-master" role="tabpanel">
                                    <div class="card small-card option-2 option-2 mb-4">
                                        <div class="card-header">
                                            <h5 class="card-title mb-0">UPLOAD NEW - STP SCHEME MASTER</h5>
                                        </div>
                                        <div class="card-body pt-4 pb-4">
                                            <form enctype="multipart/form-data" id="upload-bank" method="POST"
                                                action="">
                                                <input type="hidden" name="master_upload_type" value="bank">
                                                <div class="row">
                                                    <div class="col-xl-4 col-sm-12">
                                                        <div class="form-group mb-3 mb-sm-0">
                                                            <label for="stp_scheme_upload">Upload</label>
                                                            <label for="stp_scheme_upload" class="btn input-btn w-100">
                                                                <svg width="24" height="24" viewBox="0 0 24 24">
                                                                    <use xlink:href="#upload"></use>
                                                                </svg>
                                                                <input id="stp_scheme_upload" type="file" name="stp_scheme_upload" accept=".xlsx, .xls" (change)="fileBrowseHandler($event , true)">
                                                                <div class="value-wrap">
                                                                    <span *ngIf="!documentFileExcel" class="default-text">Upload</span>
                                                                    <h6 class="default-text" *ngIf="documentFileExcel">{{documentFileExcel.name}}</h6>
                                                                    <span class="value"></span>
                                                                </div>
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                                <button class="btn btn-success mt-4" (click)="onSaveExcel()" [disabled]="isBusyExcel">
                                                    <div *ngIf="isBusyExcel == true" class="spinner-border text-light" appDnd (fileDropped)="onFileDropped($event , true)"
                                                        role="status">
                                                    </div>
                                                    <span *ngIf="!isBusyExcel">Upload</span>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
