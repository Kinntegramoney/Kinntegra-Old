<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-associate-leftbar-template [activeComp]="'entity-detail'" [activeSubComp]="''"
                            [associateId]="associateid" [progressPercentage]="14" [mode]="mode"
                            [ts]="ts"></app-associate-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <section class="trial step2 active" id="entity-detail" data-step="2" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBack()"></i> Entity
                                        Details</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row flex-column">
                                                <div class="col-sm-6 entitytype_id">
                                                    <div class="form-group">
                                                        <label for="entitytype_id">Entity Type <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objAssociateEntityType.EntityTypeId"
                                                                name="EntityType" (change)="onEntityTypeChange()"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let entity of entities"
                                                                    [value]="entity.Id">{{entity.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-12 entity_name" *ngIf="EntityName">
                                                    <div class="form-group">
                                                        <label for="entity_name">Entity Name (As per Pancard) <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="entity_name" aria-describedby="entity_name"
                                                            name="entity_name" [(ngModel)]="objAssociate.EntityName"
                                                            [disabled]="!isEdit">

                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-sm-6 authorised_person1">
                                                    <div class="form-group">
                                                        <label for="authorised_person1">{{ Individual ? 'Authorised
                                                            Person' : 'Authorised Person 1' }}<span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="authorised_person1"
                                                            aria-describedby="authorised_person1"
                                                            name="authorised_person1"
                                                            [(ngModel)]="objAssociate.AuthorisedPerson1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 authorised_email1">
                                                    <div class="form-group">
                                                        <label for="authorised_email1">{{ IndividualEmail ? 'Email' :
                                                            'Email 1' }}<span class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="authorised_email1"
                                                            aria-describedby="authorised_email1"
                                                            name="authorised_email1" [(ngModel)]="objAssociate.Email1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row" *ngIf="AuthMobOne">
                                                <div class="col-sm-6 authorised_mobile1">
                                                    <div class="form-group">
                                                        <label for="authorised_mobile1">{{ IndividualMobile ? 'Mobile' : 'Mobile 1' }}<span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="authorised_mobile1" maxlength="10" 
                                                            aria-describedby="authorised_mobile1"
                                                            name="authorised_mobile1"
                                                            [(ngModel)]="objAssociate.Mobile1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 authorised_pan1">
                                                    <div class="form-group">
                                                        <label for="authorised_pan1">{{ IndividualPAN ? 'PAN' :
                                                            'PAN 1' }}<span class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-uppercase" id="authorised_pan1"
                                                            aria-describedby="authorised_pan1" maxlength="10"
                                                            name="authorised_pan1" [(ngModel)]="objAssociate.PAN1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row" *ngIf="AuthPerTwo">
                                                <div class="col-sm-6 authorised_person2">
                                                    <div class="form-group">
                                                        <label for="authorised_person2">Authorised Person 2 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="authorised_person2"
                                                            aria-describedby="authorised_person2"
                                                            name="authorised_person2"
                                                            [(ngModel)]="objAssociate.AuthorisedPerson2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 authorised_email2">
                                                    <div class="form-group">
                                                        <label for="authorised_email2">Email 2 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="email" class="form-control" id="authorised_email2"
                                                            aria-describedby="authorised_email2"
                                                            name="authorised_email2" [(ngModel)]="objAssociate.Email2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row" *ngIf="AuthMobTwo">
                                                <div class="col-sm-6 authorised_mobile2">
                                                    <div class="form-group">
                                                        <label for="authorised_mobile2">Mobile 2 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="authorised_mobile2" maxlength="10" 
                                                            aria-describedby="authorised_mobile2"
                                                            name="authorised_mobile2"
                                                            [(ngModel)]="objAssociate.Mobile2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 authorised_pan2">
                                                    <div class="form-group">
                                                        <label for="authorised_pan2">PAN 2 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="pan" class="form-control text-uppercase" id="authorised_pan2"
                                                            aria-describedby="authorised_pan2" maxlength="10"
                                                            name="authorised_pan2" [(ngModel)]="objAssociate.PAN2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row" *ngIf="AuthPerThree">
                                                <div class="col-sm-6 authorised_person3">
                                                    <div class="form-group">
                                                        <label for="authorised_person3">Authorised Person 3</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="authorised_person3"
                                                            aria-describedby="authorised_person3"
                                                            name="authorised_person3"
                                                            [(ngModel)]="objAssociate.AuthorisedPerson3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 authorised_email3">
                                                    <div class="form-group">
                                                        <label for="authorised_email3">Email 3</label>
                                                        <input type="email" class="form-control" id="authorised_email3"
                                                            aria-describedby="authorised_email3"
                                                            name="authorised_email3" [(ngModel)]="objAssociate.Email3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row" *ngIf="AuthMobThree">
                                                <div class="col-sm-6 authorised_mobile3">
                                                    <div class="form-group">
                                                        <label for="authorised_mobile3">Mobile 3</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="authorised_mobile3" maxlength="10" 
                                                            aria-describedby="authorised_mobile3"
                                                            name="authorised_mobile3"
                                                            [(ngModel)]="objAssociate.Mobile3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 authorised_pan3">
                                                    <div class="form-group">
                                                        <label for="authorised_pan3">PAN 3 </label>
                                                        <input type="pan" class="form-control text-uppercase" id="authorised_pan3"
                                                            aria-describedby="authorised_pan3" maxlength="10"
                                                            name="authorised_pan3" [(ngModel)]="objAssociate.PAN3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
