<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4"></div>
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-associate-leftbar-template [activeComp]="'nominee-detail'" [activeSubComp]="'guardian'"
                            [associateId]="associateid" [progressPercentage]="70" [mode]="mode"
                            [ts]="ts"></app-associate-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <section class="trial step10 active" id="guardian-detail" data-step="10" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                                            (click)="onBack()"></i> Guardian
                                        Details</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row">
                                                <div class="col-sm-8 guardian_name">
                                                    <div class="form-group">
                                                        <label for="guardian_name">Guardian Name <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="guardian_name"
                                                            class="form-control text-capitalize"
                                                            [(ngModel)]="objNomineeGuardian.Name" name="guardian_name"
                                                            aria-describedby="guardian_name" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-12">
                                                    <div class="row">
                                                        <div class="col-sm-8 guardian_pan_no">
                                                            <div class="form-group">
                                                                <label for="guardian_pan_no">PAN Number <span
                                                                        class="required-sign">*</span></label>
                                                                <input type="text" class="form-control text-uppercase"
                                                                    id="guardian_pan_no"
                                                                    [(ngModel)]="objNomineeGuardian.PANCardNumber"
                                                                    name="guardian_pan_no"
                                                                    aria-describedby="guardian_pan_no" maxlength="10"
                                                                    [disabled]="!isEdit">
                                                            </div>
                                                        </div>
                                                        <div class="col-sm-4 guardian_pan_upload">
                                                            <div class="form-group">
                                                                <label for="guardian_pan_upload" class="w-100">PROOF
                                                                    <span class="required-sign">*</span>
                                                                </label>
                                                                <label for="guardian_pan_upload"
                                                                    class="btn input-btn w-100"
                                                                    [ngClass]="{'input-btn-primary': (nomineeGuardianPANCardFileName != ''), 'input-btn-danger': (nomineeGuardianPANCardFileName == '')}"
                                                                    [ngbTooltip]="nomineeGuardianPANCardFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                                    <svg width="24" height="24" viewBox="0 0 24 24">
                                                                        <use xlink:href="#upload" />
                                                                    </svg>
                                                                    <input id="guardian_pan_upload" type="file"
                                                                        name="guardian_pan_upload"
                                                                        (change)="onNomineeGuardianPANCardFileChanged($event)"
                                                                        [disabled]="!isEdit" />
                                                                    <div class="value-wrap">
                                                                        <span class="default-text"
                                                                            *ngIf="nomineeGuardianPANCardFileName == ''">Upload</span>
                                                                        <span class="value"
                                                                            *ngIf="nomineeGuardianPANCardFileName != ''">{{nomineeGuardianPANCardFileName|fileDisplayName}}</span>
                                                                    </div>
                                                                </label>
                                                                <label class="w-100 format"
                                                                    *ngIf="nomineeGuardianPANCardFileName == ''">
                                                                    <span class="text-lowercase text-danger">FORMAT-
                                                                        PNG, JPG, PDF</span>
                                                                </label>
                                                                <label class="w-100 preview"
                                                                    *ngIf="nomineeGuardianPANCardFileName != ''">
                                                                    <span class="text-lowercase font-italic"><a
                                                                            (click)="onNomineeGuardianPANCardPreview()">Preview</a></span>
                                                                </label>
                                                            </div>
                                                        </div>
                                                        <div class="col-sm-8 guardian_nominee_relation">
                                                            <div class="form-group">
                                                                <label for="guardian_nominee_relation">Relation With
                                                                    Nominee <span class="required-sign">*</span></label>
                                                                <div class="form-control ng-select-form-control">
                                                                    <ng-select
                                                                        [(ngModel)]="objNomineeGuardian.RelationId"
                                                                        name="state" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                        <ng-option *ngFor="let ralation of ralations"
                                                                            [value]="ralation.Id">{{ralation.Name}}</ng-option>
                                                                    </ng-select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="col-12">
                                                    <div class="form-group custom-checkbox">
                                                        <!-- <input type="checkbox" id="guardian_primary_address"
                                                            name="guardian_primary_address"
                                                            value="data->associate_nominee->nominee_primary_address }}"
                                                            @if
                                                            (isset($data->associate_nominee->nominee_primary_address) &&
                                                        $data->associate_nominee->nominee_primary_address == 1) {{
                                                        'checked' }} @endif> -->
                                                        <input #chkprimary type="checkbox" id="guardian_primary_address"
                                                            name="guardian_primary_address"
                                                            (change)="onPrimaryAddressChange(chkprimary.checked)"
                                                            [(ngModel)]="objNomineeGuardian.IsAddressAsPrimaryHolder"
                                                            [disabled]="!isEdit">
                                                        <label for="guardian_primary_address">Address same as per
                                                            Primary Holder</label>
                                                    </div>
                                                </div>

                                                <div class="col-sm-6 guardian_address1">
                                                    <div class="form-group">
                                                        <label for="guardian_address1">Address 1 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="guardian_address1"
                                                            [(ngModel)]="objNomineeGuardian.Address1"
                                                            aria-describedby="guardian_address1"
                                                            name="guardian_address1" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_address2">
                                                    <div class="form-group">
                                                        <label for="guardian_address2">Address 2</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="guardian_address2"
                                                            [(ngModel)]="objNomineeGuardian.Address2"
                                                            aria-describedby="guardian_address2"
                                                            name="guardian_address2" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_address3">
                                                    <div class="form-group">
                                                        <label for="guardian_address3">Address 3</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="guardian_address3"
                                                            [(ngModel)]="objNomineeGuardian.Address3"
                                                            aria-describedby="guardian_address3"
                                                            name="guardian_address3" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_city">
                                                    <div class="form-group">
                                                        <label for="guardian_city">City <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="guardian_city" [(ngModel)]="objNomineeGuardian.City"
                                                            aria-describedby="guardian_city" name="guardian_city"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_state">
                                                    <div class="form-group">
                                                        <label for="guardian_state">State <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objNomineeGuardian.StateId"
                                                                name="state" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let state of states"
                                                                    [value]="state.Id">{{state.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_country">
                                                    <div class="form-group">
                                                        <label for="guardian_country">Country <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objNomineeGuardian.CountryId"
                                                                name="country" (change)="getState('new')"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let country of countries"
                                                                    [value]="country.Id">{{country.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_pincode">
                                                    <div class="form-group">
                                                        <label for="guardian_pincode">Pincode <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="guardian_pincode" class="form-control"
                                                            [(ngModel)]="objNomineeGuardian.PinCode"
                                                            aria-describedby="guardian_pincode" name="guardian_pincode"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_mobile">
                                                    <div class="form-group">
                                                        <label for="guardian_mobile">Mobile Number <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="guardian_mobile"
                                                            [(ngModel)]="objNomineeGuardian.MobileNumber" maxlength="10"
                                                            aria-describedby="guardian_mobile" name="guardian_mobile"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_telephone">
                                                    <div class="form-group">
                                                        <label for="guardian_telephone">TELEPHONE NO</label>
                                                        <input type="text" class="form-control" id="guardian_telephone"
                                                            [(ngModel)]="objNomineeGuardian.TelephoneNumber"
                                                            aria-describedby="guardian_telephone"
                                                            name="guardian_telephone" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 guardian_email">
                                                    <div class="form-group">
                                                        <label for="guardian_email">EMAIL ADDRESS <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="guardian_email"
                                                            [(ngModel)]="objNomineeGuardian.Email"
                                                            aria-describedby="guardian_email" name="guardian_email"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
