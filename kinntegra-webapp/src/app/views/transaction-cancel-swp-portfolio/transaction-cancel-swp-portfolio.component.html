<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-transaction-leftbar-template [transactionId]="clientTransactionId"
                            [progressPercentage]="progressPercentage"></app-transaction-leftbar-template>
                    </div>
                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <div class="form-inner-section">
                            <div class="form-header">
                                <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                                        (click)="onBackClicked()"></i>Cancel: <span
                                        class="text-capitalize">SWP</span></h3>
                            </div>
                            <div class="form-content">
                                <div class="transaction-wrapper dynamic">
                                    <div class="transaction-steps">
                                        <div class="row" *ngIf="existingSWP.length > 0">
                                            <div class="col-xl-12 col-md-12">
                                                <h6>Existing SWP</h6>
                                            </div>
                                        </div>
                                        <div class="row" *ngFor="let item of existingSWP; index as i">
                                            <div class="col-xl-2 col-md-3">
                                                <div class="form-group">
                                                    <label>Frequency</label>
                                                    <span class="form-control">{{item.SWPFrequency}}</span>
                                                </div>
                                            </div>
                                            <div class="col-xl-2 col-md-3">
                                                <div class="form-group">
                                                    <label>Months</label>
                                                    <span class="form-control">{{item.SWPMonths}}</span>
                                                </div>
                                            </div>
                                            <!-- <div class="col-xl-3 col-md-3">
                                                <div class="form-group">
                                                    <label>SWP Withdrawal %</label>
                                                    <span class="form-control">{{item.SWPPercentage}}</span>
                                                </div>
                                            </div> -->
                                            <div class="col-xl-2 col-md-3">
                                                <div class="sip_amount1">
                                                    <div class="form-group mb-3">
                                                        <label>SWP Amount</label>
                                                        <span class="form-control amount">{{item.SWPAmount}}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-xl-3 col-md-3">
                                                <div class="form-group">
                                                    <label>Start Date</label>
                                                    <span class="form-control">{{item.SWPStartDate | date:'dd-MM-yyyy'}}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-footer ">
                                <button (click)="onProceed()" class="btn btn-primary btn-lg ml-4 proceed "
                                    [disabled]="disableProceed">Proceed</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
