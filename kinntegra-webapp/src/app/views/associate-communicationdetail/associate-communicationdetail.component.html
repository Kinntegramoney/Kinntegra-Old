<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-associate-leftbar-template [activeComp]="'entity-detail'" [activeSubComp]="'communication'"
                            [associateId]="associateid" [progressPercentage]="28" [mode]="mode"
                            [ts]="ts"></app-associate-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <section class="trial step4 active" id="address-detail" data-step="4" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <!-- If Selected Individual on Entity Type, then Address 1, Address 2, Address 3, City, State, Country, Pincode,Mobile Number,Telephone No,Email Address Require -->
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                                            (click)="onBack()"></i>
                                        Communication
                                        Details
                                    </h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row">
                                                <div class="col-sm-12 address1">
                                                    <div class="form-group ">
                                                        <label for="address1">Address 1 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="address1" [(ngModel)]="objCommunication.Address1"
                                                            aria-describedby="address1" name="address1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-12 address2">
                                                    <div class="form-group ">
                                                        <label for="address2">Address 2 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="address2" [(ngModel)]="objCommunication.Address2"
                                                            aria-describedby="address2" name="address2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 address3">
                                                    <div class="form-group">
                                                        <label for="address3">Address 3</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="address3" [(ngModel)]="objCommunication.Address3"
                                                            aria-describedby="address3" name="address3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>


                                                <div class="col-sm-6 city">
                                                    <div class="form-group">
                                                        <label for="city">City <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="city" [(ngModel)]="objCommunication.City"
                                                            aria-describedby="city" name="city" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 country">
                                                    <div class="form-group">
                                                        <label for="country">Country <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objCommunication.CountryId"
                                                                name="country" (change)="getState('new')"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let country of countries"
                                                                    [value]="country.Id">{{country.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 state">
                                                    <div class="form-group">
                                                        <label for="state">State <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objCommunication.StateId"
                                                                name="state" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let state of states"
                                                                    [value]="state.Id">{{state.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 pincode">
                                                    <div class="form-group">
                                                        <label for="pincode">Pincode <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="pincode" class="form-control"
                                                            [(ngModel)]="objCommunication.PinCode"
                                                            aria-describedby="pincode" name="pincode"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 address_upload">
                                                    <div class="form-group">
                                                        <label for="address_upload" class="w-100">PROOF
                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="address_upload" class="btn input-btn w-100"
                                                            [ngClass]="{'input-btn-primary': (addressProofFileName != ''), 'input-btn-danger': (addressProofFileName == '')}"
                                                            [ngbTooltip]="addressProofFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="address_upload" type="file" name="address_upload"
                                                                (change)="onAddressProofFileChanged($event)"
                                                                [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <span class="default-text"
                                                                    *ngIf="addressProofFileName == ''">Upload</span>
                                                                <span class="value"
                                                                    *ngIf="addressProofFileName != ''">{{addressProofFileName|fileDisplayName}}</span>
                                                            </div>
                                                        </label><label class="w-100 format"
                                                            *ngIf="addressProofFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>

                                                        <label class="w-100 preview" *ngIf="addressProofFileName != ''">
                                                            <span class="text-lowercase font-italic"><a
                                                                    (click)="onAddressProofPreview()">Preview</a></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 mobile">
                                                    <div class="form-group">
                                                        <label for="mobile">Mobile Number <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control" id="mobile"
                                                            [(ngModel)]="objCommunication.MobileNumber" maxlength="10"
                                                            aria-describedby="mobile" name="mobile"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 telephone">
                                                    <div class="form-group">
                                                        <label for="telephone">TELEPHONE NO</label>
                                                        <input type="text" class="form-control" id="telephone"
                                                            [(ngModel)]="objCommunication.TelephoneNumber"
                                                            aria-describedby="telephone" name="telephone"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 email">
                                                    <div class="form-group">
                                                        <label for="email">EMAIL ADDRESS <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objCommunication.Email" name="email"
                                                                (change)="getEmail()" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let email of emails"
                                                                    [value]="email.Email">{{email.Email}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
