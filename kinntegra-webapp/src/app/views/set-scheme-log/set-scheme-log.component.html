<div class="table-top-section">
    <div class="section-header mb-4">
        <!-- @include('partials.top') -->
        <app-header-right-template class="section-header"></app-header-right-template>
    </div>
</div>
<div class="card w-100">
    <div class="card-body">
        <div class="row">
            <!-- @include('admin.adminmenu') -->
            <!-- <div class="col-xl-3 col-lg-4 col-md-4">
                <app-admin-master-leftbar-template></app-admin-master-leftbar-template>
            </div> -->
            <div class="container-fluid col-lg-8 col-xl-12">
                <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBack()"></i>Manage Scheme
                    Logs
                    <button class="btn btn-link d-md-none" id="toggleMenu">Admin Menu</button>
                </h3>
                <div class="card mb-4" style="margin-top: 20px;">
                    <div class="card-body">
                        <div class="row flex-row-reverse ">

                            <div class="col-lg-12">
                                <div class="admin-body">
                                    <div class="row">
                                        <div class="col-xl-12 mb-3 mb-xl-0">
                                            <nav ngbNav #nav="ngbNav" class="nav nav-tabs mb-3">
                                                <ng-container ngbNavItem>
                                                    <a ngbNavLink>Scheme Log</a>
                                                    <ng-template ngbNavContent>
                                                        <div class="tab-pane fade show active" id="admin-equity"
                                                            role="tabpanel">
                                                            <ngx-datatable class="material" [rows]="ObjSchemeLogDetails"
                                                                [columnMode]="ColumnMode.force" [rowHeight]="'auto'"
                                                                [headerHeight]="50" [footerHeight]="50" [limit]="10"
                                                                [scrollbarH]="true" class="custom-header">
                                                                <ngx-datatable-column [sortable]="true"
                                                                    prop="SchemeCategory" name="SchemeCategory"
                                                                    [width]="100">
                                                                    <ng-template ngx-datatable-header-template
                                                                        let-column="column">
                                                                        Scheme Category
                                                                    </ng-template>
                                                                    <ng-template ngx-datatable-cell-template
                                                                        let-rowIndex="rowIndex" let-value="value"
                                                                        let-row="row">
                                                                        {{row.SchemeCategory}}
                                                                    </ng-template>
                                                                </ngx-datatable-column>

                                                                <ngx-datatable-column [sortable]="true"
                                                                    prop="SchemeType" name="SchemeType" [width]="100">
                                                                    <ng-template ngx-datatable-header-template
                                                                        let-column="column">
                                                                        Scheme Type
                                                                    </ng-template>
                                                                    <ng-template ngx-datatable-cell-template
                                                                        let-rowIndex="rowIndex" let-value="value"
                                                                        let-row="row">
                                                                        {{row.SchemeType}}
                                                                    </ng-template>
                                                                </ngx-datatable-column>

                                                                <ngx-datatable-column [sortable]="true" prop="BuyType"
                                                                    name="BuyType" [width]="100">
                                                                    <ng-template ngx-datatable-header-template
                                                                        let-column="column">
                                                                        Buy Type
                                                                    </ng-template>
                                                                    <ng-template ngx-datatable-cell-template
                                                                        let-rowIndex="rowIndex" let-value="value"
                                                                        let-row="row">
                                                                        {{row.BuyType}}
                                                                    </ng-template>
                                                                </ngx-datatable-column>

                                                                <ngx-datatable-column [sortable]="true" prop="SellType"
                                                                    name="SellType" [width]="100">
                                                                    <ng-template ngx-datatable-header-template
                                                                        let-column="column">
                                                                        Sell Type
                                                                    </ng-template>
                                                                    <ng-template ngx-datatable-cell-template
                                                                        let-rowIndex="rowIndex" let-value="value"
                                                                        let-row="row">
                                                                        {{row.SellType}}
                                                                    </ng-template>
                                                                </ngx-datatable-column>

                                                                <ngx-datatable-column [sortable]="true" prop="PortFolio"
                                                                    name="PortFolio" [width]="100">
                                                                    <ng-template ngx-datatable-header-template
                                                                        let-column="column">
                                                                        PortFolio
                                                                    </ng-template>
                                                                    <ng-template ngx-datatable-cell-template
                                                                        let-rowIndex="rowIndex" let-value="value"
                                                                        let-row="row">
                                                                        {{row.Portfolio}}
                                                                    </ng-template>
                                                                </ngx-datatable-column>
                                                            </ngx-datatable>
                                                        </div>
                                                    </ng-template>
                                                </ng-container>
                                            </nav>

                                        </div>
                                      
                                       
                                        <div [ngbNavOutlet]="nav" class="mt-2"></div>
                                  
                                        
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="card-footer ">
                        <button class="btn btn-primary btn-lg  float-end">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
