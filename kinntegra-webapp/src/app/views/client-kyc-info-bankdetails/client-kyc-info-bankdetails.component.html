<div class="main">
    <div class="container-fluid">
        <!-- <div class="table-top-section d-flex justify-content-between align-items-center mb-4"> -->
        <!-- <a class="back-btn" href="#">
                <i class="icon-left-arrow"></i>
                Go Back
            </a> -->
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"></app-header-right-template>
        </div>
        <!-- </div> -->
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-client-leftbar-template [activeComp]="'kyc-info'" [activeSubComp]="memberId+'kyc-bank'"
                            [clientId]="clientId" [leadId]="leadId" [mode]="mode"
                            [progressPercentage]="33"></app-client-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <!-- @foreach (profiles as profile) -->
                        <!-- -- @if(i == 1)'active'@endif -- -->
                        <!-- <section class="trial step @if(i == c)'active'@endif edit_bank_detail"
                            id="bank-details_pid" data-step="i" data-bankcount="bank_count"
                            data-pid="pid" autocomplete="off"> -->
                        <section class="trial.step" id="bank-details_pid" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                                            (click)="onBackClicked()"></i>
                                        {{profileName}} - Bank Details
                                        <!-- @if (step == 'completed' && details == 0) -->
                                        <!-- @endif -->
                                    </h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-sub-header-warning"
                                    *ngIf="mode=='verify' && modificationLog.length > 0">
                                    <div *ngFor="let item of modificationLog">
                                        <div>
                                            <span class="badge badge-default badge-pill">{{item.ModificationDate | date:
                                                'dd-MM-yyyy'}}</span>
                                        </div>
                                        <div class="content">{{item.ModificationReason}}</div>
                                    </div>
                                </div>
                                <div class="form-content">

                                    <div class="col-12 bank_detail_pid" id="bank_detail_pid">
                                        <div class="form-sections mb-0">
                                            <ul ngbNav #navBank="ngbNav" class="nav nav-tabs banks-tab"
                                                [activeId]="activeBankTab">
                                                <li [ngbNavItem]="i" class="nav-item add-bank-item mb-4"
                                                    *ngFor="let bankItem of banks; index as i">
                                                    <button ngbNavLink class="nav-link add-bank bank_added">{{i+1}} - {{
                                                        bankItem.BankName }} - {{bankItem.BankAccountTypeName}}</button>
                                                    <ng-template ngbNavContent>
                                                        <div>
                                                            <p *ngIf="!bankItem.IsActive">
                                                                Note::Only Superadmin can
                                                                have access to activate it again</p>
                                                            <div class="row">
                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label for="bank-ifsc_no_pid_bank-{{i}}">IFSC
                                                                            Code<span
                                                                                class="required-sign">*</span></label>
                                                                        <div class="input-group ">
                                                                            <input type="text"
                                                                                class="form-control text-uppercase"
                                                                                placeholder="Enter IFSC Code"
                                                                                name="bank-ifsc_no_pid_bank-{{i}}"
                                                                                [(ngModel)]="bankItem.IFSC"
                                                                                [disabled]="!isEdit">
                                                                            <div class="input-group-append">
                                                                                <span
                                                                                    class="input-group-text ifsc_search"
                                                                                    (click)="onBankIfscSearchClicked(bankItem)"
                                                                                    *ngIf="isEdit">
                                                                                    <svg width="24" height="24"
                                                                                        viewBox="0 0 24 24">
                                                                                        <use xlink:href="#search" />
                                                                                    </svg>
                                                                                </span>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label for="bank-bank_name_pid_bank-{{i}}">Bank
                                                                            Name<span
                                                                                class="required-sign">*</span></label>
                                                                        <input type="text"
                                                                            class="form-control bank_name"
                                                                            placeholder="Enter Bank Name"
                                                                            name="bank-bank_name_pid_bank-{{i}}"
                                                                            [(ngModel)]="bankItem.BankName"
                                                                            [disabled]="!isEdit">
                                                                    </div>
                                                                </div>
                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label
                                                                            for="bank-branch_name_pid_bank-{{i}}">Bank
                                                                            Branch<span
                                                                                class="required-sign">*</span></label>
                                                                        <input type="text"
                                                                            class="form-control branch_name"
                                                                            placeholder="Enter Bank Branch"
                                                                            name="bank-branch_name_pid_bank-{{i}}"
                                                                            [(ngModel)]="bankItem.BankBranch"
                                                                            [disabled]="!isEdit">
                                                                    </div>
                                                                </div>

                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label for="bank-micr_pid_bank-{{i}}">MICR<span
                                                                                class="required-sign"></span></label>
                                                                        <input type="text" class="form-control micr"
                                                                            placeholder="Enter MICR"
                                                                            name="bank-micr_pid_bank-{{i}}"
                                                                            maxlength="9" [(ngModel)]="bankItem.MICR"
                                                                            [disabled]="!isEdit">
                                                                    </div>
                                                                </div>

                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label for="bank-account_type_pid-{{i}}">Account
                                                                            type<span
                                                                                class="required-sign">*</span></label>
                                                                        <div
                                                                            class="form-control ng-select-form-control">
                                                                            <ng-select
                                                                                name="bank-account_type_pid-{{i}}"
                                                                                [(ngModel)]="bankItem.BankAccountTypeId"
                                                                                (change)="onBankAccountTypeChanged(bankItem)"
                                                                                [disabled]="!isEdit" appendTo="body"
                                                                                [dropdownPosition]="'bottom'">
                                                                                <ng-option
                                                                                    *ngFor="let bankAccountType of bankAccountTypes"
                                                                                    [value]="bankAccountType.Id">{{
                                                                                    bankAccountType.Name }}</ng-option>
                                                                            </ng-select>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label
                                                                            for="bank-account_no_pid_bank-{{i}}">Account
                                                                            Number<span
                                                                                class="required-sign">*</span></label>
                                                                        <input type="text"
                                                                            class="form-control account_no"
                                                                            placeholder="Enter Account Number"
                                                                            name="bank-account_no_pid_bank-{{i}}"
                                                                            [(ngModel)]="bankItem.AccountNumber"
                                                                            [disabled]="!isEdit">
                                                                    </div>
                                                                </div>
                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label for="bank-upi_id_pid_bank-{{i}}">UPI
                                                                            Id</label>
                                                                        <input type="text"
                                                                            class="form-control account_no"
                                                                            placeholder="Enter Account Number"
                                                                            name="bank-upi_id_pid_bank-{{i}}"
                                                                            [(ngModel)]="bankItem.UPIId"
                                                                            [disabled]="!isEdit">
                                                                    </div>
                                                                </div>
                                                                <div class="col-sm-3">
                                                                    <div class="form-group">
                                                                        <label
                                                                            for="bank-cheque_upload_pid_bank-{{i}}">Proof<span
                                                                                class="required-sign">*</span></label>

                                                                        <label for="bank-cheque_upload_pid_bank-{{i}}"
                                                                            class="btn input-btn w-100"
                                                                            [ngClass]="{'input-btn-primary': (bankItem.DocumentFileName != ''), 'input-btn-danger': (bankItem.DocumentFileName == '')}"
                                                                            [ngbTooltip]="bankItem.DocumentFileName"
                                                                            tooltipClass="custom-tooltip"
                                                                            placement="bottom">

                                                                            <svg width="24" height="24"
                                                                                viewBox="0 0 24 24">
                                                                                <use xlink:href="#upload" />
                                                                            </svg>
                                                                            <input type="file" class="kyc_upload"
                                                                                id="bank-cheque_upload_pid_bank-{{i}}"
                                                                                name="bank-cheque_upload_pid_bank-{{i}}"
                                                                                (change)="onBankFileChanged($event, bankItem)"
                                                                                [disabled]="!isEdit" />
                                                                            <div class="value-wrap">
                                                                                <span class="default-text"
                                                                                    *ngIf="bankItem.DocumentFileName == ''">
                                                                                    Upload
                                                                                </span>
                                                                                <span class="value"
                                                                                    *ngIf="bankItem.DocumentFileName != ''">{{bankItem.DocumentFileName|fileDisplayName}}</span>
                                                                            </div>
                                                                        </label>
                                                                        <label class="w-100 preview"
                                                                            *ngIf="bankItem.DocumentFileName != ''">
                                                                            <span class="text-lowercase font-italic"><a
                                                                                    (click)="onBankProofPreview(bankItem)">Preview</a></span>
                                                                        </label>
                                                                    </div>
                                                                </div>
                                                                <div class="col-sm-3" *ngIf="bankItem.IsActive == true">
                                                                    <div class="form-group">
                                                                        <!-- <label for="bank-deactivate_pid_bank-{{i}}">Mark
                                                                            As Deactive</label> -->
                                                                        <button type="button" class="btn btn-danger"
                                                                            (click)="onDeactivate(bankItem)"
                                                                            [disabled]="!isEdit">
                                                                            Deactivate
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                                <div class="col-sm-3"
                                                                    *ngIf="bankItem.IsActive == false && isSuperUser == true">
                                                                    <div class="form-group">
                                                                        <!-- <label for="bank-activate_bank-{{i}}">Mark
                                                                            As Active</label> -->
                                                                        <button type="button" class="btn btn-success"
                                                                            (click)="onActivate(bankItem)"
                                                                            [disabled]="!isEdit">
                                                                            Activate
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </ng-template>
                                                </li>
                                                <li *ngIf="isEdit" [ngbNavItem]="-1"
                                                    class="nav-item add-bank-item mb-4">
                                                    <button ngbNavLink class="nav-link add-bank"
                                                        (click)="onAddBankClicked()">Add Bank</button>
                                                    <ng-template ngbNavContent>
                                                        <div class="row">
                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label>IFSC Code<span
                                                                            class="required-sign">*</span></label>
                                                                    <div class="input-group ">
                                                                        <input type="text"
                                                                            class="form-control text-uppercase ifsc_no"
                                                                            placeholder="Enter IFSC Code"
                                                                            name="bank-ifsc_no_pid_bank_count"
                                                                            [(ngModel)]="objNewBank.IFSC"
                                                                            (blur)="onAddNewBankClicked()">
                                                                        <div class="input-group-append">
                                                                            <span class="input-group-text ifsc_search"
                                                                                id="table-search_pid_bank_count"
                                                                                (click)="onNewBankIfscSearchClicked()">
                                                                                <svg width="24" height="24"
                                                                                    viewBox="0 0 24 24">
                                                                                    <use xlink:href="#search" />
                                                                                </svg>
                                                                            </span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label>Bank Name<span
                                                                            class="required-sign">*</span></label>
                                                                    <input type="text" class="form-control"
                                                                        placeholder="Enter Bank Name"
                                                                        name="bank-bank_name_pid_bank_count"
                                                                        [(ngModel)]="objNewBank.BankName"
                                                                        (blur)="onAddNewBankClicked()">
                                                                </div>
                                                            </div>
                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label>Bank Branch<span
                                                                            class="required-sign">*</span></label>
                                                                    <input type="text" class="form-control"
                                                                        placeholder="Enter Bank Branch"
                                                                        name="bank-branch_name_pid_bank_count"
                                                                        [(ngModel)]="objNewBank.BankBranch"
                                                                        (blur)="onAddNewBankClicked()">
                                                                </div>
                                                            </div>

                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label>MICR<span
                                                                            class="required-sign"></span></label>
                                                                    <input type="text" class="form-control"
                                                                        placeholder="Enter MICR"
                                                                        name="bank-micr_pid_bank_count"
                                                                        [(ngModel)]="objNewBank.MICR" maxlength="9"
                                                                        (blur)="onAddNewBankClicked()">
                                                                </div>
                                                            </div>

                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label>Account type<span
                                                                            class="required-sign">*</span></label>
                                                                    <div class="form-control ng-select-form-control">
                                                                        <ng-select name="taxstatus"
                                                                            [(ngModel)]="objNewBank.BankAccountTypeId"
                                                                            (change)="onNewBankAccountTypeChanged()"
                                                                            appendTo="body"
                                                                            [dropdownPosition]="'bottom'">
                                                                            <ng-option
                                                                                *ngFor="let bankAccountType of bankAccountTypes"
                                                                                [value]="bankAccountType.Id">{{
                                                                                bankAccountType.Name }}</ng-option>
                                                                        </ng-select>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label>Account Number<span
                                                                            class="required-sign">*</span></label>
                                                                    <input type="text" class="form-control"
                                                                        placeholder="Enter Account Number"
                                                                        name="bank-account_no_pid_bank_count"
                                                                        [(ngModel)]="objNewBank.AccountNumber"
                                                                        (blur)="onAddNewBankClicked()">
                                                                </div>
                                                            </div>
                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label>UPI Id</label>
                                                                    <input type="text" class="form-control"
                                                                        placeholder="Enter UPI Id"
                                                                        name="bank-upi_id_pid_bank_count"
                                                                        [(ngModel)]="objNewBank.UPIId"
                                                                        (blur)="onAddNewBankClicked()">
                                                                </div>
                                                            </div>
                                                            <div class="col-sm-3">
                                                                <div class="form-group">
                                                                    <label
                                                                        for="new_bank_cheque_upload_pid_bank_count">Proof<span
                                                                            class="required-sign">*</span></label>
                                                                    <label for="new_bank_cheque_upload_pid_bank_count"
                                                                        class="btn input-btn w-100"
                                                                        [ngClass]="{'input-btn-primary': (objNewBank.DocumentFileName != ''), 'input-btn-danger': (objNewBank.DocumentFileName == '')}"
                                                                        [ngbTooltip]="objNewBank.DocumentFileName"
                                                                        tooltipClass="custom-tooltip"
                                                                        placement="bottom">

                                                                        <svg width="24" height="24" viewBox="0 0 24 24">
                                                                            <use xlink:href="#upload" />
                                                                        </svg>
                                                                        <input
                                                                            id="new_bank_cheque_upload_pid_bank_count"
                                                                            name="new_bank_cheque_upload_pid_bank_count"
                                                                            class="cheque_upload" type="file"
                                                                            (change)="onNewBankFileChanged($event)" />
                                                                        <div class="value-wrap">
                                                                            <span class="default-text"
                                                                                *ngIf="objNewBank.DocumentFileName == ''">Upload</span>
                                                                            <span class="value"
                                                                                *ngIf="objNewBank.DocumentFileName != ''">{{objNewBank.DocumentFileName|fileDisplayName}}</span>
                                                                        </div>
                                                                    </label>
                                                                    <label class="w-100 format"
                                                                        *ngIf="objNewBank.DocumentFileName == ''">
                                                                        <span class="text-lowercase text-danger">FORMAT-
                                                                            PNG, JPG,
                                                                            PDF</span>
                                                                    </label>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </ng-template>
                                                </li>
                                            </ul>
                                            <div [ngbNavOutlet]="navBank"></div>
                                        </div>
                                    </div>
                                    <!-- Error Message -->
                                    <!-- @if(isset(profile->vrejectionremarks) && !empty(profile->vrejectionremarks))
                                    @if(bremark > 0) -->
                                    <div class="row" *ngIf="isErrors">
                                        <div class="col-md-12">
                                            <div class="card small-card option-2 mb-4">
                                                <div class="card-header">
                                                    <h6 class="card-title">Rejected Reason</h6>
                                                </div>
                                                <div class="card-body">
                                                    <div class="transaction-wrapper trade-status">
                                                        <!-- @foreach (profile->vrejectionremarks as profile_remark)
                                                        @if(profile_remark->type == 'bankid') -->
                                                        <div class="transaction-steps regected">
                                                            <div class="trade-title mb-1">
                                                                <h4 class="mb-0">profile_remark.remarks</h4>
                                                                <div class="info">
                                                                    <!-- <span>
                                                                        Carbon\Carbon::parse(profile_remark.created_at).format('h:i:s
                                                                        A')</span>
                                                                    <span>
                                                                        Carbon\Carbon::parse(profile_remark.created_at).format('l,
                                                                        jS F Y')</span> -->
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <!-- @endif
                                                        @endforeach -->
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- @endif
                                    @endif -->
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                        <!-- @endforeach -->
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
