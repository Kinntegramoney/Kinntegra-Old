<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header" *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>


        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">

                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-employee-leftbar-template [activeComp]="'employee-detail'" [activeSubComp]="'address'"
                            [employeeId]="employeeAddressDetailsId" [progressPercentage]="48"
                            [mode]="mode" [ts]="ts"></app-employee-leftbar-template>
                    </div>


                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0" enctype="multipart/form-data"
                        id="form-information">
                        <section class="trial active" id="employee-detail" data-step="2" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBack()"></i>Address
                                        Details</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row" id="correspondence_address">
                                                <div class="col-sm-12">
                                                    <h4 class="card-title">Correspondence Address</h4>
                                                </div>

                                                <div class="col-sm-12 c_address1">
                                                    <div class="form-group ">
                                                        <label for="c_address1">Address 1 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="c_address1" value="" aria-describedby="c_address1"
                                                            name="c_address1"
                                                            [(ngModel)]="objEmployeeAddressDetails.CAddress1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-12 c_address2">
                                                    <div class="form-group ">
                                                        <label for="c_address2">Address 2 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="c_address2" value="" aria-describedby="c_address2"
                                                            name="c_address2"
                                                            [(ngModel)]="objEmployeeAddressDetails.CAddress2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 c_address3">
                                                    <div class="form-group">
                                                        <label for="c_address3">Address 3</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="c_address3" value="" aria-describedby="c_address3"
                                                            name="c_address3"
                                                            [(ngModel)]="objEmployeeAddressDetails.CAddress3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 c_city">
                                                    <div class="form-group">
                                                        <label for="c_city">City <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="c_city" value="" aria-describedby="c_city" name="c_city"
                                                            [(ngModel)]="objEmployeeAddressDetails.CCity"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 c_country">
                                                    <div class="form-group">
                                                        <label for="c_country">Country <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select
                                                                [(ngModel)]="objEmployeeAddressDetails.CCountryId"
                                                                name="country" (change)="getCState()"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let country of countries"
                                                                    [value]="country.Id">{{country.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 c_state">
                                                    <div class="form-group">
                                                        <label for="c_state">State <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objEmployeeAddressDetails.CStateId"
                                                                name="state" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let state of cstates"
                                                                    [value]="state.Id">{{state.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="col-sm-6 c_pincode">
                                                    <div class="form-group">
                                                        <label for="c_pincode">Pincode <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="c_pincode" class="form-control" value=""
                                                            [disabled]="!isEdit" aria-describedby="c_pincode"
                                                            name="c_pincode"
                                                            [(ngModel)]="objEmployeeAddressDetails.CPinCode">
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 c_address_upload">
                                                    <input type="hidden" name="is_c_address_upload" value="">
                                                    <div class="form-group">
                                                        <label for="c_address_upload" class="w-100">PROOF

                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="c_address_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (corrospondanceDocumentFileName != ''), 'input-btn-danger': (corrospondanceDocumentFileName == '')}"
                                                        [ngbTooltip]="corrospondanceDocumentFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>

                                                            <input type="file" name="c_address_upload"
                                                                class="c_address_upload" id="c_address_upload"
                                                                (change)="onCorrospondanceAddressFileChanged($event)" [disabled]="!isEdit" />

                                                            <div class="value-wrap"> 
                                                                <span class="default-text" *ngIf=" corrospondanceDocumentFileName == ''">Upload</span>
                                                                <span class="value" *ngIf=" corrospondanceDocumentFileName != ''">{{corrospondanceDocumentFileName|fileDisplayName}}</span>
                                                               

                                                            </div>
                                                        </label>
                      

                                                        <label class="w-100 format" *ngIf=" corrospondanceDocumentFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>

                                                        <label class="w-100 preview" *ngIf="corrospondanceDocumentFileName != ''">
                                                            <span class="text-lowercase font-italic text-primary"><a
                                                                    (click)="onCorrospondanceAddressProofPreview()">Preview</a></span>
                                                        </label>


                                                    </div>
                                                </div>
                                                <div class="col-sm-12">
                                                    <div class="form-group custom-checkbox">
                                                        <input #chkpermanent type="checkbox" id="permanent_address"
                                                            [disabled]="!isEdit" name="permanent_address"
                                                            (change)="onPermanentAddressChange(chkpermanent.checked)"
                                                            [(ngModel)]="objEmployeeAddressDetails.IsPermanentSame">
                                                        <label for="permanent_address">Permanent Address Same As
                                                            Correspondence Address</label>
                                                    </div>
                                                </div>
                                            </div>



                                            <div class="row" id="permanent_address"
                                                *ngIf="!objEmployeeAddressDetails.IsPermanentSame">
                                                <div class="col-sm-12">
                                                    <h4 class="card-title">Permanent Address</h4>
                                                </div>
                                                <div class="col-sm-12 p_address1">
                                                    <div class="form-group ">
                                                        <label for="p_address1">Address 1 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="p_address1" value="" aria-describedby="p_address1"
                                                            name="p_address1"
                                                            [(ngModel)]="objEmployeeAddressDetails.PAddress1"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-12 p_address2">
                                                    <div class="form-group ">
                                                        <label for="p_address2">Address 2 <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="p_address2" value="" aria-describedby="p_address2"
                                                            name="p_address2"
                                                            [(ngModel)]="objEmployeeAddressDetails.PAddress2"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 p_address3">
                                                    <div class="form-group">
                                                        <label for="p_address3">Address 3</label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="p_address3" value="" aria-describedby="p_address3"
                                                            name="p_address3"
                                                            [(ngModel)]="objEmployeeAddressDetails.PAddress3"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 p_city">
                                                    <div class="form-group">
                                                        <label for="p_city">City <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control text-capitalize"
                                                            id="p_city" value="" aria-describedby="p_city" name="p_city"
                                                            [(ngModel)]="objEmployeeAddressDetails.PCity"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 p_country">
                                                    <div class="form-group">
                                                        <label for="p_country">Country <span
                                                                class="required-sign">*</span></label>

                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select
                                                                [(ngModel)]="objEmployeeAddressDetails.PCountryId"
                                                                name="country" (change)="getPState()"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let country of countries"
                                                                    [value]="country.Id">{{country.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-6 p_state">
                                                    <div class="form-group">
                                                        <label for="p_state">State <span
                                                                class="required-sign">*</span></label>

                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objEmployeeAddressDetails.PStateId"
                                                                name="state" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let state of pstates"
                                                                    [value]="state.Id">{{state.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="col-sm-6 p_pincode">
                                                    <div class="form-group">
                                                        <label for="p_pincode">Pincode <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="p_pincode" class="form-control" value=""
                                                            [disabled]="!isEdit" aria-describedby="p_pincode"
                                                            name="p_pincode"
                                                            [(ngModel)]="objEmployeeAddressDetails.PPinCode">
                                                    </div>
                                                </div>

                                                <div class="col-sm-4 p_address_upload">
                                                    <input type="hidden" name="is_p_address_upload" value="">
                                                    <div class="form-group">
                                                        <label for="p_address_upload" class="w-100">PROOF

                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="p_address_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (permenantDocumentFileName != ''), 'input-btn-danger': (permenantDocumentFileName == '')}" 
                                                        [ngbTooltip]="permenantDocumentFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>

                                                            <input type="file" name="p_address_upload"
                                                                class="p_address_upload" id="p_address_upload"
                                                                (change)="onPermanentAddressFileChanged($event)" [disabled]="!isEdit" />

                                                            <div class="value-wrap">
                                                                <span class="default-text" *ngIf="permenantDocumentFileName == ''">Upload</span>
                                                                <span class="value" *ngIf=" permenantDocumentFileName != ''">{{permenantDocumentFileName|fileDisplayName}}</span>
                                                             

                                                            </div>
                                                        </label>

                       
                                                        <label class="w-100 format" *ngIf="permenantDocumentFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>

                                                        <label class="w-100 preview" *ngIf="permenantDocumentFileName != ''">
                                                            <span class="text-lowercase font-italic text-primary"><a
                                                                    (click)="onPermanentAddressProofPreview()">Preview</a></span>
                                                        </label>


                                                    </div>
                                                </div>

                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
