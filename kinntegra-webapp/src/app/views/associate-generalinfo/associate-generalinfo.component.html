<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-associate-leftbar-template [activeComp]="'general-information'" [activeSubComp]="''"
                            [associateId]="associateid" [progressPercentage]="7" [mode]="mode"
                            [ts]="ts"></app-associate-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0" enctype="multipart/form-data">
                        <section class="trial step1 active" id="general-information" data-step="1" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"> General Information</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row flex-column">
                                                <div class="col-sm-8 introducer_id" *ngIf="associates.length > 0">
                                                    <div class="form-group">
                                                        <label for="introducer_id">Introduced by
                                                            <span class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objAssociate.IntroducerAssociateId"
                                                                name="Associate" (change)="getEmployee()"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let associate of associates"
                                                                    [value]="associate.Id">{{associate.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 employee_id" *ngIf="isEmployee">
                                                    <div class="form-group">
                                                        <label for="employee_id">Introducer-Employee Name
                                                            <span class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select
                                                                [(ngModel)]="objAssociateIntroEmployee.EmployeeId"
                                                                name="Employee" [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let employee of employees"
                                                                    [value]="employee.Id">{{employee.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 profession_id">
                                                    <div class="form-group">
                                                        <label for="profession_id">Profession of the introducee
                                                            <span class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select [(ngModel)]="objAssociate.ProfessionId"
                                                                name="Profession" (change)="onProfessionChange()"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let profession of professions"
                                                                    [value]="profession.Id">{{profession.Name}}</ng-option>
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 business_tag">
                                                    <div class="form-group">
                                                        <label for="business_tag">Business Tag <span
                                                                class="required-sign">*</span></label>
                                                        <div class="form-control ng-select-form-control">
                                                            <ng-select
                                                                [(ngModel)]="objAssociateBusinessTag.AssociateBusinessId"
                                                                #businessTagSelect name="BusinessTag"
                                                                [disabled]="!isEdit" [dropdownPosition]="'bottom'">
                                                                <ng-option *ngFor="let businesstag of businessTagList"
                                                                    [value]="businesstag.Id">{{businesstag.Name}}</ng-option>
                                                                <!-- <ng-option *ngFor="let associate of associates"
                                                                [value]="associate.Id">{{associate.Name}}</ng-option> -->
                                                            </ng-select>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
