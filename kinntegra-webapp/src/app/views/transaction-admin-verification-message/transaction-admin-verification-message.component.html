<div class="container-fluid">
    <div class="col d-flex justify-content-center align-item-center">
        <div class="card col-8">
            <div class="card-body text-center">
                <div class="row justify-content-center">
                    <div class="col-2">
                        <ng-lottie width="100px" height="100px" [options]="lottieOptions"
                            (animationCreated)="animationCreated($event)"></ng-lottie>
                    </div>
                </div>
                <div class="row mt-4">
                    <h3 class="card-title">Trade verfication process is completed.</h3>
                    <p class="card-text">Trade data sent for client approval</p>
                </div>
                <div class="row justify-content-center mt-4">
                    <a class="btn btn-primary col-sm-2" href="tradelog">Ok</a>
                </div>
            </div>
        </div>
    </div>
</div>
