<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>


        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-employee-leftbar-template [activeComp]="'employee-detail'" [activeSubComp]="'photo'"
                            [employeeId]="employeePhotoId" [progressPercentage]="36" [mode]="mode"
                            [ts]="ts"></app-employee-leftbar-template>
                    </div>


                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0" enctype="multipart/form-data"
                        id="form-information">
                        <section class="trial active" id="employee-detail" data-step="2" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn" (click)="onBack()"></i> Photo ID
                                        Details</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row">
                                                <!-- For Individual Case :: Name, PANCARD NUMBER, AADHAR CARD NUMBER, Date of Birth field is require-->

                                                <div class="col-sm-8 pan_no">
                                                    <div class="form-group">
                                                        <label for="pan_no">PANCARD NUMBER <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text"
                                                            [(ngModel)]="objEmployeePhotoDetails.PANCardNumber"
                                                            class="form-control text-uppercase" [disabled]="!isEdit"
                                                            id="pan_no" name="pan_no" aria-describedby="pan_no"
                                                            value="">
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 pan_upload">
                                                    <div class="form-group">
                                                        <label for="pan_upload" class="w-100">PANCARD

                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="pan_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (panCardDocumentFileName != ''), 'input-btn-danger': (panCardDocumentFileName == '')}"
                                                        [ngbTooltip]="panCardDocumentFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="pan_upload" type="file" name="pan_upload"
                                                                (change)="onPanCardDetailsFileChanged($event)" [disabled]="!isEdit"  />
                                                            <div class="value-wrap">
                                                                <span class="default-text" *ngIf="panCardDocumentFileName == ''">Upload</span>
                                                                <span class="value" *ngIf="panCardDocumentFileName != ''">{{panCardDocumentFileName|fileDisplayName}}</span>
                                                               
                                                            </div>
                                                        </label>
                                                        
                                                

                                                         <label class="w-100 format" *ngIf=" panCardDocumentFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>

                                                        <label class="w-100 preview" *ngIf="panCardDocumentFileName != ''">
                                                            <span class="text-lowercase font-italic text-primary"><a
                                                                    (click)="onPanCardProofPreview()">Preview</a></span>
                                                        </label>
                                              

                                                    </div>
                                                </div>
                                                <div class="col-sm-8 aadhar_no">
                                                    <div class="form-group">
                                                        <label for="aadhar_no">AADHAR CARD NUMBER <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" class="form-control"
                                                            [(ngModel)]="objEmployeePhotoDetails.AadharCardNumber"
                                                            id="aadhar_no" [disabled]="!isEdit" name="aadhar_no"
                                                            aria-describedby="aadhar_no" value=""   maxlength="12">
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 aadhar_upload">
                                                    <div class="form-group">
                                                        <label for="aadhar_upload" class="w-100">AADHAR CARD

                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="aadhar_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (aadharCardDocumentFileName != ''), 'input-btn-danger': (aadharCardDocumentFileName == '')}"
                                                        [ngbTooltip]="aadharCardDocumentFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="aadhar_upload" type="file" name="aadhar_upload"
                                                                (change)="onAadharCardDetailsFileChanged($event)" [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <span class="default-text" *ngIf=" aadharCardDocumentFileName == ''">Upload</span>
                                                                <span class="value" *ngIf="aadharCardDocumentFileName != ''">{{aadharCardDocumentFileName|fileDisplayName}}</span>
                                                               
                                                            </div>
                                                        </label>

                                                

                                                        <label class="w-100 format" *ngIf="aadharCardDocumentFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>

                                                        <label class="w-100 preview" *ngIf="aadharCardDocumentFileName != ''">
                                                            <span class="text-lowercase font-italic text-primary"><a
                                                                    (click)="onAadharCardProofPreview()">Preview</a></span>
                                                        </label>
                                          

                                                    </div>
                                                </div>
                                                <div class="col-sm-8 birth_date">
                                                    <!-- <div class="form-group">
                                                    <label for="birth_date">Date of Birth<span class="required-sign">*</span></label>
                                                    <input type="text" name="birth_date" class="form-control" id="birth_date" aria-describedby="birth_date" value="">
                                                </div> -->
                                                    <div class="form-group">
                                                        <label>Date of Birth<span class="required-sign">*</span></label>
                                                        <div class="input-group">
                                                            <input class="form-control" readonly
                                                                placeholder="dd-mm-yyyy" name="dateofbirth"
                                                                [(ngModel)]="objEmployeePhotoDetails.DateOfBirth"
                                                                ngbDatepicker #d="ngbDatepicker" [minDate]="minDate"
                                                                [maxDate]="maxDate" />
                                                            <button class="btn btn-transparent" (click)="d.toggle()"
                                                                *ngIf="isEdit" type="button"><svg width="24" height="24"
                                                                    viewBox="0 0 24 24">
                                                                    <use xlink:href="#month"></use>
                                                                </svg></button>
                                                        </div>
                                                    </div>

                                                </div>
                                                <div class="col-sm-4 photo_upload">
                                                    <div class="form-group">
                                                        <label for="photo_upload" class="w-100">SELF PHOTO

                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="photo_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (selfPhotoDocumentFileName != ''), 'input-btn-danger': (selfPhotoDocumentFileName == '')}"
                                                        [ngbTooltip]="selfPhotoDocumentFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="photo_upload" type="file" name="photo_upload"
                                                                (change)="onSelfPhotoDetailsFileChanged($event)"  [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <!-- <span class="default-text">Upload</span> -->
                                                                <span class="default-text" *ngIf="selfPhotoDocumentFileName == ''">Upload</span>
                                                                <span class="value" *ngIf="selfPhotoDocumentFileName != ''">{{selfPhotoDocumentFileName|fileDisplayName}}</span>
                                                

                                                            </div>
                                                        </label>

                                                        
                                                        <label class="w-100 format" *ngIf="selfPhotoDocumentFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>
                                                        
                                                        <label class="w-100 preview" *ngIf="selfPhotoDocumentFileName != ''">
                                                            <span class="text-lowercase font-italic text-primary"><a
                                                                    (click)="onSelfPhotoProofPreview()">Preview</a></span>
                                                        </label>



                                                    </div>
                                                </div>
                                                <div class="col-sm-8 anniversary_date">
                                                    <div class="form-group">
                                                        <label>Date of Anniversary</label>
                                                        <div class="input-group">
                                                            <input class="form-control" readonly
                                                                placeholder="dd-mm-yyyy" name="dateofanniversary"
                                                                [(ngModel)]="objEmployeePhotoDetails.DateOfAnniversary"
                                                                ngbDatepicker #d1="ngbDatepicker" [minDate]="minDate"
                                                                [maxDate]="maxDate" />
                                                            <button *ngIf="isEdit" class="btn btn-transparent"
                                                                (click)="d1.toggle()" type="button"><svg width="24"
                                                                    height="24" viewBox="0 0 24 24">
                                                                    <use xlink:href="#month"></use>
                                                                </svg></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
