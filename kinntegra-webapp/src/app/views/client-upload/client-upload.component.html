<div class="main">
    <div class="container-fluid">
        <!-- <div class="table-top-section d-flex justify-content-between align-items-center mb-4"> -->
            <!-- <a class="back-btn" href="">
                <i class="icon-left-arrow"></i>
                Go Back
            </a> -->
            <div class="section-header mb-4">
                <app-header-right-template class="section-header"></app-header-right-template>
            </div>
        <!-- </div> -->

        <div class="col d-flex justify-content-center align-item-center">
            <div class="card w-100">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                            <app-client-leftbar-template [activeComp]="'upload'" [activeSubComp]="accountId"
                                [clientId]="clientId" [leadId]="leadId" [mode]="mode"
                                [progressPercentage]="88"></app-client-leftbar-template>
                        </div>

                        <form class="col-lg-8 col-xl-9 col-md-8 step-forms ps-0">

                            <section class="trial active" id="mandate_creation" data-step="1" autocomplete="off">
                                <div class="form-inner-section">
                                    <div class="form-header">
                                        <h3 class="card-title d-inline"><i
                                                class="icon-left-arrow back-btn back_to_creation" (click)="onBackClicked()"></i>{{objAccount.AccountHolderName}}
                                            - Upload</h3>
                                    </div>
                                    <div class="form-content">
                                        <div class="row flex-column">
                                            <div class="col-xl-6 col-sm-9" *ngIf="objAccount.AOFDocument!=null">
                                                <div class="form-group">
                                                    <label for="aof_upload">Upload AOF (Do not include cheque copy in
                                                        pdf)</label>
                                                    <label for="aof_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (aofFileName != ''), 'input-btn-danger': (aofFileName == '')}"
                                                        [ngbTooltip]="aofFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                        <svg class="upload-icon" width="30" height="30"
                                                            viewBox="0 0 24 24">
                                                            <use xlink:href="#upload" />
                                                        </svg>
                                                        <input id="aof_upload" name="aof_upload" type="file"
                                                            (change)="onAOFFileChanged($event)" />
                                                        <div class="value-wrap">
                                                            <span class="default-text" *ngIf="aofFileName == ''">
                                                                Upload
                                                            </span>
                                                            <span class="value"
                                                                *ngIf="aofFileName != ''">{{aofFileName|fileDisplayName}}</span>
                                                        </div>
                                                    </label>
                                                    <label class="w-100 format" *ngIf="aofFileName == ''">
                                                        <span class="text-lowercase text-danger">FORMAT- PDF, TIFF</span>
                                                    </label>
                                                    <label class="w-100" *ngIf="aofFileName != ''">
                                                        <span class="text-lowercase font-italic"><a
                                                                (click)="onAOFPreviewClicked()">Preview</a></span>
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-sm-12" *ngIf="objAccount.MandateDocuments.length > 0">
                                                <div class="form-group">
                                                    <label for="upload-mandate">Upload Mandate</label>
                                                    <div class="row">
                                                        <div class="col-xl-3 col-sm-6 mb-3 mb-md-4"
                                                            *ngFor="let mandateItem of objAccount.MandateDocuments; index as i">
                                                            <label for="mandate_upload_{{i}}"
                                                                class="btn input-btn w-100"
                                                                [ngClass]="{'input-btn-primary': (mandateItem.DocumentFileName != ''), 'input-btn-danger': (mandateItem.DocumentFileName == '')}"
                                                                [ngbTooltip]="mandateItem.DocumentFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                                <svg class="upload-icon" width="30" height="30"
                                                                    viewBox="0 0 24 24">
                                                                    <use xlink:href="#upload" />
                                                                </svg>
                                                                <input id="mandate_upload_{{i}}"
                                                                    name="mandate_upload_{{i}}" type="file"
                                                                    (change)="onMandateFileChanged($event,mandateItem)" />
                                                                <div class="value-wrap">
                                                                    <span class="default-text"
                                                                        *ngIf="mandateItem.DocumentFileName == ''">
                                                                        {{mandateItem.FileName|fileDisplayName}}
                                                                    </span>
                                                                    <span class="value"
                                                                        *ngIf="mandateItem.DocumentFileName != ''">{{mandateItem.DocumentFileName|fileDisplayName}}</span>
                                                                </div>
                                                            </label>
                                                            <label class="w-100 format"
                                                                *ngIf="mandateItem.DocumentFileName == ''">
                                                                <span class="text-lowercase text-danger">FORMAT-
                                                                    TIFF, JPG, JPEG, PDF</span>
                                                            </label>
                                                            <label class="w-100"
                                                                *ngIf="mandateItem.DocumentFileName != ''">
                                                                <span class="text-lowercase font-italic"><a
                                                                        (click)="onMandatePreviewClicked(mandateItem)">Preview</a></span>
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-xl-6 col-lg-12 col-sm-9"
                                                *ngIf="objAccount.NIFATCADocument!=null">
                                                <div class="form-group">
                                                    <label for="fatca_upload">Upload FATCA</label>
                                                    <label for="fatca_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (niFatcaFileName != ''), 'input-btn-danger': (niFatcaFileName == '')}"
                                                        [ngbTooltip]="niFatcaFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                        <svg class="upload-icon" width="30" height="30"
                                                            viewBox="0 0 24 24">
                                                            <use xlink:href="#upload" />
                                                        </svg>
                                                        <input id="fatca_upload" name="fatca_upload" type="file"
                                                            (change)="onNIFATCAFileChanged($event)" />
                                                        <div class="value-wrap">
                                                            <span class="default-text" *ngIf="niFatcaFileName == ''">
                                                                Upload
                                                            </span>
                                                            <span class="value"
                                                                *ngIf="niFatcaFileName != ''">{{niFatcaFileName|fileDisplayName}}</span>
                                                        </div>
                                                    </label>
                                                    <label class="w-100 format" *ngIf="niFatcaFileName == ''">
                                                        <span class="text-lowercase text-danger">FORMAT- PDF</span>
                                                    </label>
                                                    <label class="w-100" *ngIf="niFatcaFileName != ''">
                                                        <span class="text-lowercase font-italic"><a
                                                                (click)="onNIFATCAPreviewClicked()">Preview</a></span>
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-xl-6 col-lg-12 col-sm-9"
                                                *ngIf="objAccount.LOEDocument!=null">
                                                <div class="form-group">
                                                    <label for="loe_upload">Upload Letter of Engagement</label>
                                                    <label for="loe_upload" class="btn input-btn w-100"
                                                        [ngClass]="{'input-btn-primary': (loeFileName != ''), 'input-btn-danger': (loeFileName == '')}"
                                                        [ngbTooltip]="loeFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                        <svg class="upload-icon" width="30" height="30"
                                                            viewBox="0 0 24 24">
                                                            <use xlink:href="#upload" />
                                                        </svg>
                                                        <input id="loe_upload" name="loe_upload" type="file"
                                                            (change)="onLOEFileChanged($event)" />
                                                        <div class="value-wrap">
                                                            <span class="default-text" *ngIf="loeFileName == ''">
                                                                Upload
                                                            </span>
                                                            <span class="value"
                                                                *ngIf="loeFileName != ''">{{loeFileName|fileDisplayName}}</span>
                                                        </div>
                                                    </label>
                                                    <label class="w-100 format" *ngIf="loeFileName == ''">
                                                        <span class="text-lowercase text-danger">FORMAT- PDF</span>
                                                    </label>
                                                    <label class="w-100" *ngIf="loeFileName != ''">
                                                        <span class="text-lowercase font-italic"><a
                                                                (click)="onLOEPreviewClicked()">Preview</a></span>
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-xl-6 col-lg-12 col-sm-9"
                                                *ngIf="objAccount.AccountProfileType=='C'">
                                                <div class="form-group custom-checkbox">
                                                    <input #chkpermanent type="checkbox" id="bse_upload"
                                                        name="bse_upload" [(ngModel)]="isFATCAUploaded" [disabled]="isCheckboxDisabled"
                                                        class="form-control">
                                                    <label for="bse_upload">FATCA Uploaded to BSE</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-footer">
                                        <ng-container *ngIf="mode == 'create'">
                                            <button type="button" class="btn btn-primary btn-lg proceed"
                                                (click)="onProceed()" [disabled]="isBusy">
                                                <div *ngIf="isBusy">
                                                    <span class="spinner-border text-light"
                                                        style="margin-right: 10px; vertical-align: middle;"
                                                        role="status"></span>
                                                    <span>Proceed</span>
                                                </div>
                                                <span *ngIf="!isBusy">Proceed</span>
                                            </button>
                                        </ng-container>
                                        <ng-container *ngIf="mode == 'edit'">
                                            <button type="button" class="btn btn-primary btn-lg proceed"
                                                (click)="onProceed()" [disabled]="isBusy">
                                                <div *ngIf="isBusy">
                                                    <span class="spinner-border text-light"
                                                        style="margin-right: 10px; vertical-align: middle;"
                                                        role="status"></span>
                                                    <span>Proceed</span>
                                                </div>
                                                <span *ngIf="!isBusy">Proceed</span>
                                            </button>
                                        </ng-container>
                                        <ng-container *ngIf="mode == 'verify2'">
                                            <button type="button" class="btn btn-primary btn-lg proceed"
                                                (click)="onProceed()" [disabled]="isBusy">
                                                <div *ngIf="isBusy">
                                                    <span class="spinner-border text-light"
                                                        style="margin-right: 10px; vertical-align: middle;"
                                                        role="status"></span>
                                                    <span>Accept</span>
                                                </div>
                                                <span *ngIf="!isBusy">Accept</span>
                                            </button>
                                            <button type="button" class="reject-now btn btn-danger btn-lg ms-3" 
                                                (click)="onNext()">Reject</button>
                                        </ng-container>
                                        <ng-container *ngIf="mode == 'externalverify'">
                                            <!-- <button type="button" class="btn btn-primary btn-lg proceed"
                                                (click)="onNext()">Next</button> -->
                                        </ng-container>
                                        <ng-container *ngIf="mode == 'viewdetails'">
                                            <!-- <button type="button" class="btn btn-primary btn-lg proceed"
                                                (click)="onNext()">Proceed</button> -->
                                        </ng-container>
                                    </div>
                                </div>
                                <!-- </div> -->
                            </section>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
