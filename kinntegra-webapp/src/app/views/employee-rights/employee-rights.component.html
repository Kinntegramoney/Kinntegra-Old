<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">

                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-employee-leftbar-template [activeComp]="'rights'" [activeSubComp]="''"
                            [employeeId]="employeeId" [mode]="mode"
                            [progressPercentage]="84"></app-employee-leftbar-template>
                    </div>


                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0" id="form-information">
                        <section class="trial active" id="employee-detail" data-step="2" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                                            (click)="onBack()"></i> Right &
                                        Authorization</h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <ng-container *ngFor="let menuItem of menuOptions; let i = index">
                                                <div class="form-sections">
                                                    <h4 class="form-section-title text-uppercase">
                                                        {{ menuItem.Module}}
                                                    </h4>
                                                    <div *ngFor="let groupItem of menuItem.MenuGroups; let j = index">
                                                        <h4 class="form-section-title text-uppercase">
                                                            {{ groupItem.MenuGroup}}
                                                        </h4>
                                                        <div class="row">
                                                            <div class="col-sm-4"
                                                                *ngFor="let item of groupItem.MenuOptions; let k = index">
                                                                <div class="form-group custom-checkbox">
                                                                    <input type="checkbox" id="menu.{{item.Id}}"
                                                                        name="menu.{{item.Id}}"
                                                                        [(ngModel)]="item.IsSelected"
                                                                        [disabled]="!isEdit">
                                                                    <label for="menu.{{item.Id}}">{{
                                                                        item.Name }}</label>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </ng-container>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onSave()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed" (click)="onSave()"
                                            [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>save</span>
                                            </div>
                                            <span *ngIf="!isBusy">save</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
