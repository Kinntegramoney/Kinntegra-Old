<div class="main">
    <div class="container-fluid">
        <div class="section-header mb-4">
            <app-header-right-template class="section-header"
                *ngIf="mode != 'externalverify'"></app-header-right-template>
        </div>
        <div class="card w-100">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-xl-3 col-lg-4 col-md-4 pe-0 ps-0">
                        <app-associate-leftbar-template [activeComp]="'certification'" [activeSubComp]="''"
                            [associateId]="associateid" [progressPercentage]="56" [mode]="mode"
                            [ts]="ts"></app-associate-leftbar-template>
                    </div>

                    <form class="col-lg-8 col-xl-9 step-forms col-md-8 ps-0">
                        <section class="trial step8 active" id="euin-detail" data-step="8" autocomplete="off">
                            <div class="form-inner-section">
                                <div class="form-header">
                                    <!-- NISM VA CERTIFICATE  -->
                                    <!-- If "PROFESSION" Selected :: MFD -->
                                    <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                                            (click)="onBack()"></i>
                                        Certification
                                    </h3>
                                    <span class="edit-now float-end mt-1" *ngIf="showEdit"
                                        (click)="onEditClicked()">Edit</span>
                                </div>
                                <div class="form-content">
                                    <div class="row">
                                        <div class="col-xl-8 col-lg-9">
                                            <div class="row" id="nism_va_details" *ngIf="showNISMVA">
                                                <div class="col-sm-12">
                                                    <h4 class="card-title">NISM VA CERTIFICATE</h4>
                                                </div>
                                                <div class="col-sm-8 nism_va_no">
                                                    <div class="form-group">
                                                        <label for="nism_va_no">NISM VA CERTIFICATE NUMBER <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="nism_va_no" class="form-control"
                                                            [(ngModel)]="objCertification.NismVaNumber"
                                                            name="nism_va_no" aria-describedby="nism_va_no"
                                                            [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 nism_va_upload">
                                                    <div class="form-group">
                                                        <label for="nism_va_upload" class="w-100">PROOF
                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="nism_va_upload" class="btn input-btn w-100"
                                                            [ngClass]="{'input-btn-primary': (nismVACertificateFileName != ''), 'input-btn-danger': (nismVACertificateFileName == '')}"
                                                            [ngbTooltip]="nismVACertificateFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="nism_va_upload" type="file" name="nism_va_upload"
                                                                (change)="onNISMVACertificateFileChanged($event)"
                                                                [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <span class="default-text"
                                                                    *ngIf="nismVACertificateFileName == ''">Upload</span>
                                                                <span class="value"
                                                                    *ngIf="nismVACertificateFileName != ''">{{nismVACertificateFileName|fileDisplayName}}</span>
                                                            </div>
                                                        </label>
                                                        <label class="w-100 format"
                                                            *ngIf="nismVACertificateFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>
                                                        <label class="w-100 preview"
                                                            *ngIf="nismVACertificateFileName != ''">
                                                            <span class="text-lowercase font-italic"><a
                                                                    (click)="onNISMVACertificatePreview()">Preview</a></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 nism_va_validity">
                                                    <div class="form-group">
                                                        <label for="nism_va_validity">VALIDITY <span
                                                                class="required-sign">*</span></label>
                                                        <div class="input-group">
                                                            <input class="form-control" readonly
                                                                placeholder="dd-mm-yyyy" name="dp"
                                                                [(ngModel)]="objCertification.NismVaValidDate"
                                                                ngbDatepicker #d1="ngbDatepicker" [minDate]="minDate"
                                                                [maxDate]="maxDate" [disabled]="!isEdit" />
                                                            <button class="btn btn-transparent" (click)="d1.toggle()"
                                                                *ngIf="isEdit" type="button"><svg width="24" height="24"
                                                                    viewBox="0 0 24 24">
                                                                    <use xlink:href="#month"></use>
                                                                </svg></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- End -->
                                            <!-- If "PROFESSION" Selected :: RIA -->

                                                        <label class="w-100 preview" *ngIf="caCertificateFileName">
                                                            <span class="text-lowercase font-italic"><a
                                                                    (click)="onCACertificatePreview()">Preview</a></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 ca_validity">
                                                    <div class="form-group">
                                                        <label for="ca_validity">VALIDITY (IF ANY)</label>
                                                        <div class="input-group">
                                                            <input class="form-control" readonly
                                                                placeholder="dd-mm-yyyy" name="dp"
                                                                [(ngModel)]="objCertification.CaValidDate" ngbDatepicker
                                                                #d6="ngbDatepicker" [minDate]="minDate"
                                                                [maxDate]="maxDate" [disabled]="!isEdit" />
                                                            <button class="btn btn-transparent" (click)="d6.toggle()"
                                                                *ngIf="isEdit" type="button"><svg width="24" height="24"
                                                                    viewBox="0 0 24 24">
                                                                    <use xlink:href="#month"></use>
                                                                </svg></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- CS CERTIFICATE  -->

                                            <div class="row" id="cs_details" *ngIf="showCS">
                                                <div class="col-sm-12">
                                                    <h4 class="card-title">CS DETAILS</h4>
                                                </div>
                                                <div class="col-sm-8 cs_no">
                                                    <div class="form-group">
                                                        <label for="cs_no">CS CERTIFICATE NO <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="cs_no" class="form-control" name="cs_no"
                                                            [(ngModel)]="objCertification.CsNumber"
                                                            aria-describedby="cs_no" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 cs_upload">
                                                    <div class="form-group">
                                                        <label for="cs_upload" class="w-100">PROOF
                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="cs_upload" class="btn input-btn w-100"
                                                            [ngClass]="{'input-btn-primary': (csCertificateFileName != ''), 'input-btn-danger': (csCertificateFileName == '')}"
                                                            [ngbTooltip]="csCertificateFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="cs_upload" type="file" name="cs_upload"
                                                                (change)="onCSCertificateFileChanged($event)"
                                                                [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <span class="default-text"
                                                                    *ngIf="csCertificateFileName == ''">Upload</span>
                                                                <span class="value"
                                                                    *ngIf="csCertificateFileName != ''">{{csCertificateFileName|fileDisplayName}}</span>
                                                            </div>
                                                        </label>
                                                        <label class="w-100 format" *ngIf="csCertificateFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>
                                                        <label class="w-100 preview"
                                                            *ngIf="csCertificateFileName != ''">
                                                            <span class="text-lowercase font-italic"><a
                                                                    (click)="onCSCertificatePreview()">Preview</a></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 cs_validity">
                                                    <div class="form-group">
                                                        <label for="cs_validity">VALIDITY (IF ANY)</label>
                                                        <div class="input-group">
                                                            <input class="form-control" readonly
                                                                placeholder="dd-mm-yyyy" name="dp"
                                                                [(ngModel)]="objCertification.CsValidDate" ngbDatepicker
                                                                #d7="ngbDatepicker" [minDate]="minDate"
                                                                [maxDate]="maxDate" [disabled]="!isEdit" />
                                                            <button class="btn btn-transparent" (click)="d7.toggle()"
                                                                *ngIf="isEdit" type="button"><svg width="24" height="24"
                                                                    viewBox="0 0 24 24">
                                                                    <use xlink:href="#month"></use>
                                                                </svg></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- OTHER CERTIFICATE  -->

                                            <div class="row" id="course_details" *ngIf="showDegree">
                                                <div class="col-sm-12">
                                                    <h4 class="card-title">Degree/Course Details</h4>
                                                </div>
                                                <div class="col-sm-8 course_name">
                                                    <div class="form-group">
                                                        <label for="course_name">Name of Course/Degree <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="course_name" class="form-control"
                                                            [(ngModel)]="objCertification.CourseName" name="course_name"
                                                            aria-describedby="course_name" [disabled]="!isEdit">
                                                    </div>
                                                </div>
                                                <div class="col-sm-4 course_upload">
                                                    <div class="form-group">
                                                        <label for="course_upload" class="w-100">PROOF
                                                            <span class="required-sign">*</span>
                                                        </label>
                                                        <label for="course_upload" class="btn input-btn w-100"
                                                            [ngClass]="{'input-btn-primary': (courseCertificateFileName != ''), 'input-btn-danger': (courseCertificateFileName == '')}"
                                                            [ngbTooltip]="courseCertificateFileName" tooltipClass="custom-tooltip" placement="bottom">
                                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                                <use xlink:href="#upload" />
                                                            </svg>
                                                            <input id="course_upload" type="file" name="course_upload"
                                                                (change)="onCourseCertificateFileChanged($event)"
                                                                [disabled]="!isEdit" />
                                                            <div class="value-wrap">
                                                                <span class="default-text"
                                                                    *ngIf="courseCertificateFileName == ''">Upload</span>
                                                                <span class="value"
                                                                    *ngIf="courseCertificateFileName != ''">{{courseCertificateFileName|fileDisplayName}}</span>
                                                            </div>
                                                        </label>
                                                        <label class="w-100 format"
                                                            *ngIf="courseCertificateFileName == ''">
                                                            <span class="text-lowercase text-danger">FORMAT- PNG, JPG,
                                                                PDF</span>
                                                        </label>
                                                        <label class="w-100 preview"
                                                            *ngIf="courseCertificateFileName != ''">
                                                            <span class="text-lowercase font-italic"><a
                                                                    (click)="onCourseCertificatePreview()">Preview</a></span>
                                                        </label>
                                                    </div>
                                                </div>
                                                <div class="col-sm-8 course_no">
                                                    <div class="form-group">
                                                        <label for="course_no">COURSE CERTIFICATE NO <span
                                                                class="required-sign">*</span></label>
                                                        <input type="text" id="course_no" class="form-control"
                                                            [(ngModel)]="objCertification.CourseNumber" name="course_no"
                                                            aria-describedby="course_no" [disabled]="!isEdit">
                                                    </div>
                                                </div>

                                                <div class="col-sm-8 course_validity">
                                                    <div class="form-group">
                                                        <label for="course_validity">VALIDITY (IF ANY)</label>
                                                        <div class="input-group">
                                                            <input class="form-control" readonly
                                                                placeholder="dd-mm-yyyy" name="dp"
                                                                [(ngModel)]="objCertification.CourseValidDate"
                                                                ngbDatepicker #d8="ngbDatepicker" [minDate]="minDate"
                                                                [maxDate]="maxDate" [disabled]="!isEdit" />
                                                            <button class="btn btn-transparent" (click)="d8.toggle()"
                                                                *ngIf="isEdit" type="button"><svg width="24" height="24"
                                                                    viewBox="0 0 24 24">
                                                                    <use xlink:href="#month"></use>
                                                                </svg></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-4 col-lg-3 d-none d-lg-flex">
                                            <ng-lottie style="height: 300px;" [options]="lottieOptions"
                                                (animationCreated)="animationCreated($event)"></ng-lottie>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-footer">
                                    <ng-container *ngIf="mode == 'create'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'edit'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'verify'">
                                        <button *ngIf="isEdit" type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onProceed()" [disabled]="isBusy">
                                            <div *ngIf="isBusy">
                                                <span class="spinner-border text-light"
                                                    style="margin-right: 10px; vertical-align: middle;"
                                                    role="status"></span>
                                                <span>Proceed</span>
                                            </div>
                                            <span *ngIf="!isBusy">Proceed</span>
                                        </button>
                                        <button type="button" class="btn btn-primary btn-lg proceed" *ngIf="!isEdit"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'externalverify'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Next</button>
                                    </ng-container>
                                    <ng-container *ngIf="mode == 'viewdetails'">
                                        <button type="button" class="btn btn-primary btn-lg proceed"
                                            (click)="onNext()">Proceed</button>
                                    </ng-container>
                                </div>
                            </div>
                        </section>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
