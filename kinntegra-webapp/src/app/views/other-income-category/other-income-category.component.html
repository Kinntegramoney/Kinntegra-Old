<div class="table-top-section">
    <div class="section-header mb-4">
        <app-header-right-template class="section-header"></app-header-right-template>
    </div>
</div>
<div class="card w-100">
    <div class="card-body">
        <div class="row">
            <!-- <div class="col-xl-3 col-lg-4 col-md-4">
                <app-admin-master-leftbar-template></app-admin-master-leftbar-template>
            </div> -->
            <div class="container-fluid col-lg-8 col-xl-12">
                <h3 class="card-title d-inline"><i class="icon-left-arrow back-btn"
                    (click)="onBack()"></i>Other Income Category
                    <button class="btn btn-link float-end mt-1" id="add_new_data" (click)="onAddnew()">Add New</button>
                </h3>
                <div class="form-inner-section">
                    <div class="card-body">

                        <div id="success_alert"  class="alert alert-success alert-dismissible fade show"
                            style="display: none" role="alert">
                            <div class="alert-text">
                                <strong>Hooray !</strong> <span class="message"></span>
                            </div>
                            <button type="button" id="success_alert_close" class="close" data-dismiss="alert"
                                aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="row flex-row-reverse ">

                            <div class="col-lg-9 border-left col-md-7 ">
                                <div class="admin-body">
                                    <!-- <ul class="nav nav-tabs mb-4" id="lead-generation" role="tablist">
                                        <li class="nav-item" role="presentation">
                                            <a class="nav-link active" data-toggle="tab" href="#admin-tax" role="tab"
                                                aria-selected="true">Income Category</a>
                                        </li>
                                    </ul> -->
                                    <div class="tab-content" id="leadsContent">
                                        <div class="tab-pane fade show active" id="admin-tax" role="tabpanel">
                                            <div class="card small-card option-2 option-2 mb-4">
                                                <div class="card-header">
                                                    <h5 class="card-title mb-0 status">{{ buttonText }}</h5>
                                                    <span class="edit-now float-right mt-1" *ngIf="!ShowEditButton"
                                                        (click)="onEditClicked()">Edit</span>
                                                </div>
                                                <div class="card-body pt-4 pb-4">
                                                    <form id="add-update-data" method="POST" action="">
                                                        <input type="hidden" name="id" value="">
                                                        <div class="row">
                                                            <div class="col-xl-4 col-sm-12 name">
                                                                <div class="form-group mb-3 mb-sm-0">
                                                                    <label>Name</label>
                                                                    <input type="text" name="name" class="form-control"
                                                                        [disabled]="!isEdit"
                                                                        [(ngModel)]="objOtherIncome.Name"
                                                                        placeholder="Enter Name">
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <button type="submit" (click)="onSave()"
                                                            class="btn btn-primary mt-4">Save</button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-3 col-md-5">
                                <h5 class="card-title mb-3">Lists</h5>
                                <div class="input-group ">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text" id="table-search">
                                            <svg width="24" height="24" viewBox="0 0 24 24">
                                                <use xlink:href="#search"></use>
                                            </svg>
                                        </span>
                                    </div>
                                    <input type="text" name="master_search" id="master_search" class="form-control"
                                        placeholder="Search" aria-label="table-search" aria-describedby="table-search">
                                </div>
                                <ul class="logs-list mt-4">
                                    <li *ngFor="let item of OtherIncome">
                                        <a (click)="onSelectedItem(item.Id)">
                                            <h4>{{item.Name}}</h4>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
