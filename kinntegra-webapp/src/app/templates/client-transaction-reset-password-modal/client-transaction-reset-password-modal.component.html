<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="staticLeadLabel">Reset Password</h5>
    </div>
    <div class="modal-body">
        <div class="error-lists">
            <div *ngIf="!isSuccess">
                You will receive reset password instruction mail on {{email}}
            </div>
            <div *ngIf="isSuccess">
                You will receive reset password instruction mail if provided email id match with registered account.
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="d-flex justify-content-end w-100">
            <button class="btn btn-secondary col-sm-3 mb-2" (click)="activeModal.dismiss('Cross click')" *ngIf="!isSuccess">Cancel</button>
            <button class="btn btn-primary col-sm-6 ms-3 mb-2" (click)="onResetPasswordClick()" *ngIf="!isSuccess">Send Reset Password Link</button>
            <button class="btn btn-primary col-sm-3 mb-2" (click)="activeModal.dismiss('Cross click')" *ngIf="isSuccess">Ok</button>
        </div>
    </div>
</div>
