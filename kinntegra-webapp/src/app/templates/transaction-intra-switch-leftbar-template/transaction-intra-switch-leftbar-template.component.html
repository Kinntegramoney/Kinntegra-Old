<div class="custom-wrapper-left">
    <div class="inner-section">
        <h3 class="card-title">New Transaction</h3>
        <div class="form-percentage">
            <svg viewBox="0 0 36 36" class="circular-chart orange">
                <path class="circle-bg" d="M18 2.0845
                                    a 15.9155 15.9155 0 0 1 0 31.831
                                    a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle" [attr.stroke-dasharray]="strokeDasharray" d="M18 2.0845
                                    a 15.9155 15.9155 0 0 1 0 31.831
                                    a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="20.35" class="percentage">{{progressPercentage}}%</text>
            </svg>
        </div>
        <div class="form-lists">
            <div class="transaction-table-wrap">
                <div class="title">
                    <svg width="40" height="40" viewBox="0 0 60 60">
                        <use xlink:href="#transactions"></use>
                    </svg>
                    <h6>Trade for {{objTransaction.ClientName}}</h6>
                </div>
                <div class="table-wrap">
                    <table class="transaction-table">
                        <tr *ngFor="let item of accountsData">
                            <th *ngIf="item.UCC != ''">
                                <ng-template #htmlAccountContent>
                                    <div innerHTML="{{item.TooltipContent}}" style="text-align: left;"></div>
                                </ng-template>
                                <span [ngbTooltip]="htmlAccountContent" tooltipClass="custom-tooltip" placement="right"
                                    triggers="hover" container="body">{{item.UCC}}</span>
                            </th>
                            <th *ngIf="item.UCC == ''">
                                <ng-template #htmlAccountContent>
                                    <div innerHTML="{{item.TooltipContent}}" style="text-align: left;"></div>
                                </ng-template>
                                <span [ngbTooltip]="htmlAccountContent" tooltipClass="custom-tooltip" placement="right"
                                    triggers="hover" container="body">No UCC</span>
                            </th>
                            <td>₹{{item.CurrentAmount | indianCurrencyNumber}}</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
