<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="staticLeadLabel">Hey, Good News...</h5>
    </div>
    <div class="modal-body">
        <div class="error-lists">
            {{message}}
        </div>
    </div>
    <div class="modal-footer">
        <div class="d-flex justify-content-end w-100">
            <button class="btn btn-primary col-sm-3 mb-2" (click)="CloseModel()" data-dismiss="modal">Ok</button>
        </div>
    </div>
</div>
