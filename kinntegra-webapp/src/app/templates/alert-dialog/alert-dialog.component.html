<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="staticLeadLabel">Need your attention!</h5>
    </div>
    <div class="modal-body">
        <div class="error-lists">
            <ul>
                <li *ngFor="let message of data">{{message.Title}}</li>
            </ul>
        </div>
    </div>
    <div class="modal-footer">
        <div class="d-flex justify-content-end w-100">
            <button class="btn btn-primary col-sm-3 mb-2" (click)="activeModal.dismiss('Cross click')">Ok</button>
        </div>
    </div>
</div>
