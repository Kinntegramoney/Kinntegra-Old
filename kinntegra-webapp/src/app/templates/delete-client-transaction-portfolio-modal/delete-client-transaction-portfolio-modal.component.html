<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="staticLeadLabel">Confirmation</h5>
    </div>
    <div class="modal-body">
        <div class="error-lists" *ngIf="IsSingle">
            This is the only transaction that you are trying to initiate. Would you like to delete this transaction?
        </div>
        <div class="error-lists" *ngIf="!IsSingle">
            Are you sure you want to delete this transaction?
        </div>
    </div>
    <div class="modal-footer">
        <div class="d-flex justify-content-end w-100">
            <button class="btn btn-secondary col-sm-3 mb-2" (click)="activeModal.dismiss('Cross click')">No</button>
            <button class="btn btn-primary col-sm-9 ms-3 mb-2" (click)="CloseModel()" data-dismiss="modal"
                *ngIf="IsSingle">Delete and Create New Transaction</button>
            <button class="btn btn-primary col-sm-3 ms-3 mb-2" (click)="CloseModel()" data-dismiss="modal"
                *ngIf="!IsSingle">Yes</button>
        </div>
    </div>
</div>
